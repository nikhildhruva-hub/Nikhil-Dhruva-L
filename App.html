let c2iState = { unlocked:false, solved:false, transitionDone:false };

function isTextQuestion(item){ return item && item.type === 'text'; }

function evaluateC2IAnswer(item, value){
  const text = (value || '').trim();
  if(!text){ return { pass:false, message:'Please type an answer before submitting.' }; }

  const words = text.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(Boolean);
  if(words.length < (item.minWords || 8)){
    return { pass:false, message:`Please write at least ${item.minWords} words.` };
  }

  if(item.stage === 'Solver'){
    const keys = item.keywords || [];
    const hitCount = keys.filter(k => text.toLowerCase().includes(k.toLowerCase())).length;
    if(hitCount >= 2 || text.toLowerCase().includes('low frequency') || text.toLowerCase().includes('vibration')){
      return { pass:true, message:'Good explanation. The transition questions are now unlocked.' };
    }
    return { pass:false, message:'Try linking the movement to frequency, vibration, and the energy being transferred through the water.' };
  }

  if(item.stage === 'Innovator'){
    return { pass:true, message:'Nice idea. You have completed the innovation stage.' };
  }

  return { pass:true, message:'Thank you for sharing your observation.' };
}

function submitTextAnswer(item){
  const answerBox = $('textAnswer');
  if(!answerBox) return;

  const result = evaluateC2IAnswer(item, answerBox.value);
  if(!result.pass){
    say(result.message, 2600);
    return;
  }

  if(item.stage === 'Solver'){
    c2iState.solved = true;
    c2iState.unlocked = true;
    c2iState.transitionDone = true;
  }

  if(item.stage === 'Transition'){
    c2iState.transitionDone = true;
  }

  if(item.stage === 'Innovator' && c2iState.transitionDone){
    c2iState.unlocked = true;
  }

  $('verdict').textContent = 'Response recorded.';
  $('verdict').className = 'verdict good';
  $('feedback').classList.add('on');
  $('explain').textContent = item.stage === 'Solver'
    ? 'Lower frequency means the water is being driven more strongly over time, so the movement becomes easier to see and more energetic.'
    : item.stage === 'Transition'
      ? 'The pattern changes because the vibration is changing, which alters how energy is transferred through the water.'
      : 'Your idea is valuable. Keep building on the pattern you noticed.';
  $('wonder').textContent = 'What would you test next?';

  $('nextBtn').style.visibility = 'visible';
  $('nextBtn').textContent = (idx === round.length - 1) ? 'See your score' : 'Next question';
  $('nextBtn').focus({preventScroll:true});
  clearTimeout(advanceTimer);
  clearInterval(tickTimer);
  advanceTimer = setTimeout(next, AUTO_ADVANCE_SEC * 1000);
}

   'question' = a fresh clock on every question, 'off' = no timer.
   The clock pauses while an explanation is on screen either way.   */

const KEY_MISSES  = 'parsec_wf_quiz_misses';
const KEY_DAY     = 'parsec_wf_quiz_day';

/* ================== STORAGE ================== */
function today(){ return new Date().toDateString(); }
function store(key, fallback){
  try{
    if(localStorage.getItem(KEY_DAY) !== today()){
      localStorage.setItem(KEY_DAY, today());
      localStorage.removeItem(KEY_PLAYERS);
      localStorage.removeItem(KEY_MISSES);
      localStorage.removeItem(KEY_GAME);
      localStorage.removeItem(KEY_BULB);
      localStorage.removeItem(KEY_PUZ);
      localStorage.removeItem(KEY_WIND);
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

function startRound(zid){
  clearTimers();
  zoneId = zid;
  c2iState = { unlocked:false, solved:false, transitionDone:false };

  if(C2I_ROUNDS[zid]){
    round = C2I_ROUNDS[zid].map(q => ({...q}));
    idx = 0; score = 0; right = 0; wrong = 0;
    const z = ZONES.find(z => z.id === zid);
    $('zoneName').textContent = z ? z.name : 'Across the floor';
    $('scoreWho').textContent = player;
    setHost(zid || (ZONES[Math.floor(Math.random()*ZONES.length)].id));
    paintScore();
    show('quiz');
    renderQuestion();
    return;
  }

  const pool = zid ? QUESTIONS.filter(q => q.zone === zid) : QUESTIONS;
  round = shuffle(pool).slice(0, Math.min(PER_ROUND, pool.length));
  idx=0; score=0; right=0; wrong=0;
  const z = ZONES.find(z => z.id === zid);
  $('zoneName').textContent = z ? z.name : 'Across the floor';
  $('scoreWho').textContent = player;
  setHost(zid || (ZONES[Math.floor(Math.random()*ZONES.length)].id));
  paintScore();
  show('quiz');
  if(TIMER_MODE === 'round') startClock();
  renderQuestion();
}

function renderQuestion(){

  box.className = 'opts'; box.innerHTML = '';

  if(isTextQuestion(item)){
    const isLockedTransition = item.stage === 'Transition' && !c2iState.solved;
    const isLockedInnovator = item.stage === 'Innovator' && !c2iState.transitionDone;

    if(isLockedTransition || isLockedInnovator){
      const notice = document.createElement('div');
      notice.className = 'c2i-note';
      notice.textContent = isLockedTransition
        ? 'This question unlocks after a previous answer is completed.'

      const actions = document.createElement('div');
      actions.className = 'c2i-actions';

      $('verdict').textContent = '';

    const notice = document.createElement('div');
    notice.className = 'c2i-note';
    notice.textContent = 'Type your response in the box below.';
    box.appendChild(notice);

    const field = document.createElement('textarea');
    field.id = 'textAnswer';
    field.placeholder = 'Type your answer here...';
    field.rows = 5;
    field.value = '';
    box.appendChild(field);

    const actions = document.createElement('div');
    actions.className = 'c2i-actions';

    const submit = document.createElement('button');
    submit.className = 'opt';
    submit.textContent = 'Submit';
    submit.addEventListener('click', () => submitTextAnswer(item));
    actions.appendChild(submit);

    if(item.allowSkip){
      const skip = document.createElement('button');
      skip.className = 'opt alt';
      skip.textContent = 'Skip';
      skip.addEventListener('click', () => next());
      actions.appendChild(skip);
    }

    box.appendChild(actions);
    $('verdict').textContent = '';
    $('verdict').className = 'verdict';
    $('explain').textContent = '';
    $('wonder').textContent = '';
    return;
  }

  item.options.forEach((text,i) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = text;
    b.addEventListener('click', () => answer(i));
    box.appendChild(b);
  });

  if(TIMER_MODE === 'question') startClock();
  else if(TIMER_MODE === 'round') runClock();   // resume after the explanation pause
}

/* ---------- countdown clock ---------- */
let timeLeft = 0, clockInt = null;

function paintClock(){
  const c = $('clock');
  $('clockNum').textContent = Math.max(0, timeLeft);
  c.classList.toggle('warn', timeLeft <= 20 && timeLeft > 10);
  c.classList.toggle('crit', timeLeft <= 10);
}
function startClock(){
  if(TIMER_MODE === 'off'){ $('clock').classList.add('hide'); return; }
  $('clock').classList.remove('hide');
  timeLeft = TIMER_SECONDS;
  paintClock();
  runClock();
}
function runClock(){
  if(TIMER_MODE === 'off') return;
  clearInterval(clockInt);
  clockInt = setInterval(() => {
    timeLeft--;
    paintClock();
    if(timeLeft <= 0) timeUp();
  }, 1000);
}
function stopClock(){ clearInterval(clockInt); clockInt = null; }

function timeUp(){
  stopClock();
  if(TIMER_MODE === 'question'){
    if(!locked) answer(-1);          // no choice made: counts as wrong
  }else{
    locked = true;
    $('opts').classList.add('locked');
    say("Time's up!", 4000);
    finish();
  }
}

function popScore(delta, good){
  const pop = $('pop');
  pop.textContent = (delta > 0 ? '+' : '\u2212') + Math.abs(delta);
  pop.style.color = good ? 'var(--amber)' : 'var(--coral)';
  pop.classList.remove('go'); void pop.offsetWidth; pop.classList.add('go');
}

function answer(choice){
  if(locked) return;
  const item = round[idx];
  if(isTextQuestion(item)){
    return submitTextAnswer(item);
  }

  locked = true;
  stopClock();
  const isRight = choice === item.answer;
  $('opts').classList.add('locked');
  [...$('opts').children].forEach((b,i) => {
    if(i === item.answer) b.classList.add('correct');
    else if(i === choice) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const delta = isRight ? POINTS_RIGHT : POINTS_WRONG;
  score += delta;
  isRight ? right++ : wrong++;
  paintScore();

  if(!isRight){
    const m = store(KEY_MISSES, {});
    m[item.q] = (m[item.q] || 0) + 1;
    save(KEY_MISSES, m);
  }

  popScore(delta, isRight);
  react(isRight);

  $('verdict').textContent = isRight ? 'Right \u2014 and here is why.' : 'Not this time. Here is what is going on.';
  $('verdict').className = 'verdict ' + (isRight ? 'good' : 'bad');
  $('explain').textContent = item.explain;
  $('wonder').textContent = item.wonder;
  $('feedback').classList.add('on');

  const label = (idx === round.length-1) ? 'See your score' : 'Next question';
  const btn = $('nextBtn');
  btn.style.visibility = 'visible';
  btn.focus({preventScroll:true});
  let left = AUTO_ADVANCE_SEC;
  btn.textContent = `${label} (${left})`;
  tickTimer = setInterval(() => { left--; btn.textContent = left>0 ? `${label} (${left})` : label; }, 1000);
  advanceTimer = setTimeout(next, AUTO_ADVANCE_SEC*1000);
}

function next(){ clearTimers(); idx++; if(idx >= round.length) finish(); else renderQuestion(); }

function finish(){
  clearTimers();
  stopClock();
  const attempted = right + wrong;
  const max = (attempted || round.length) * POINTS_RIGHT;
  const pct = max ? score / max : 0;
  const z = ZONES.find(z => z.id === zoneId);

  $('endWho').textContent = `${player}, you brought back`;
  $('final').textContent = score;
  $('final').classList.toggle('neg', score < 0);
  $('endVerdict').textContent = lineFor(pct);
  $('tally').innerHTML =
    `<span>${right} right &middot; +${right*POINTS_RIGHT}</span>` +
    `<span>${wrong} wrong &middot; &minus;${wrong*Math.abs(POINTS_WRONG)}</span>` +
    (attempted < round.length ? `<span>${round.length-attempted} unanswered</span>` : '');

  say(score >= 0 ? 'Nice round!' : 'Come back for another go.', 5000);

  const players = store(KEY_PLAYERS, []);
  players.push({
    name: player,
    score: score,
    right: right,
    wrong: wrong,
    zone: z ? z.name : 'Mixed',
    at: new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'})
  });
  save(KEY_PLAYERS, players);

  show('end');
}

/* ---------- thank you ---------- */
function showThanks(){
  clearTimers();
  const k = hostKey || 'stephen';
  $('thanksImg').src = MASCOT[k];
  $('thanksImg').alt = HOST_NAME[k];
  $('thanksTitle').textContent = player ? `Thank you, ${player}!` : 'Thank you!';
  $('thanksLine').textContent =
    `${HOST_NAME[k]} enjoyed that. You answered ${right + wrong} question${right+wrong===1?'':'s'} and scored ${score}.`;
  show('thanks');
}

/* ---------- scroll reveal ---------- */
let revealObserver = null;
function armReveals(){
  const targets = [
    ...document.querySelectorAll('#heroSlot > *'),
    ...document.querySelectorAll('#stats > *'),
    ...document.querySelectorAll('#dash .sectitle'),
    ...document.querySelectorAll('#gcards > *'),
    ...document.querySelectorAll('#board > *'),
    ...document.querySelectorAll('#scPanel > *')
  ];
  if(!revealObserver){
    revealObserver = new IntersectionObserver(entries => {
      entries.forEach(en => en.target.classList.toggle('in', en.isIntersecting));
    }, {root: $('dash'), threshold: 0.15, rootMargin: '0px 0px -6% 0px'});
  }else{
    revealObserver.disconnect();
  }
  targets.forEach((el, i) => {
    el.classList.add('rv');
    el.style.transitionDelay = Math.min(i % 6, 5) * 55 + 'ms';
    revealObserver.observe(el);
  });
}

/* ---------- dashboard ---------- */

         </div>

       </div>`;
  }else{

      <div class="hero-eyebrow">Nobody has played yet</div>

      <div class="hero-meta"><span class="daystamp">Be the first name on it.</span></div>
    </div><div class="hero-art art">${ART.cymatics}</div></div>`;
  }

  /* stat strip */

  const totalWrong = all.reduce((s,p) => s + (p.wrong || 0), 0);
  const totalQs = totalRight + totalWrong;
  const accuracy = totalQs ? Math.round(totalRight / totalQs * 100) : 0;
  const best = players.length ? players[0].score : 0;
  const zoneCounts = {};
  all.forEach(p => { zoneCounts[p.zone] = (zoneCounts[p.zone] || 0) + 1; });

    `<div class="stat"><b>${accuracy}%</b><span>answered correctly</span></div>` +
    `<div class="stat"><b>${best}</b><span>highest score</span></div>` +
    `<div class="stat"><b>${busiest ? busiest[0] : '\u2014'}</b><span>busiest gallery</span></div>`;

  /* gallery cards */
  $('gcards').innerHTML = ZONES.map(z => {
    const n = zoneCounts[z.name] || 0;
    const hk = HOST[z.id];
    return `<div class="gcard">
      <div class="art gart">${ART[z.id]}</div>
      <div class="gbody">
        <b>${z.name}</b>
        <p>${z.about}</p>
        <span class="gplays">${HOST_NAME[hk]} hosts &middot; ${n ? n + (n === 1 ? ' round today' : ' rounds today') : 'no rounds yet'}</span>
      </div></div>`;
  }).join('');

  /* full list */
  board.innerHTML = '';
  if(!players.length){
    board.innerHTML = '<p class="empty">The board fills up as visitors play.</p>';
  }else{
    players.slice(0, 15).forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'row' + (i === 0 ? ' lead' : '');
      row.innerHTML =
        `<div class="rank">${i+1}</div>` +
        `<div class="who">${p.name}<small>${p.zone} &middot; ${p.at}</small></div>` +
        `<div class="pts${p.score < 0 ? ' neg' : ''}">${p.score}</div>`;
      board.appendChild(row);
    });
  }

  const misses = store(KEY_MISSES, {});
  const top5 = Object.entries(misses).sort((a,b) => b[1]-a[1]).slice(0,5);
  const panel = $('scPanel');
  panel.innerHTML = '';
  if(top5.length){
    const h = document.createElement('div');
    h.className = 'sectitle';
    h.textContent = 'For Science Communicators \u2014 most missed today';
    panel.appendChild(h);
    top5.forEach(([q,n]) => {
      const d = document.createElement('div');
      d.className = 'miss';
      d.innerHTML = `<span>${q}</span><span>${n} missed</span>`;
      panel.appendChild(d);
    });
  }
  show('dash');
  $('dash').scrollTop = 0;
  armReveals();
}


/* =====================================================================
   SCREAM LAB — shout and Niki jumps. Mic if allowed, tap to jump if not.
   No audio is recorded or stored; only the live loudness level is read.
   Clear a level and the next one is faster, tighter and wider.
   ===================================================================== */
const JUMP = {
  gravity: 760,       // pull downward while airborne
  jump:    550,       // push from one shout
  hold:    0.35,      // keep shouting while rising and gravity softens to this
  cooldown:0.10       // shortest gap between two hops
};
/* Each level: faster ground, rocks closer together, taller, and from
   level 4 some are wide enough that one hop only just clears them. */
function levelOf(n){
  return {
    speed:  115 * (1 + 0.13*(n-1)),
    every:  Math.max(250, 520 - 28*(n-1)),
    hMin:   28 + Math.min(18, 2.5*(n-1)),
    wide:   n >= 4 ? Math.min(0.45, 0.12*(n-3)) : 0,
    target: 6 + 2*n
  };
}
const KEY_GAME = 'parsec_wf_scream_best';
const GROUND = 46;

let gCv, gCtx, gRaf = null, gRunning = false, gLast = 0;
let gPlayer, gRocks, gCleared, gLevel, gL, gSpeed, gSprite = null;
let micStream = null, micCtx = null, micAn = null, micBuf = null, micOn = false;
let holding = false, jumpCool = 0, wasLoud = false, jumpsLeft = 1;

// Resize the canvas for high-density screens while keeping CSS pixels as the
// coordinate system used by the game physics.
function fitCanvas(){
  const r = gCv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  gCv.width = Math.round(r.width*dpr); gCv.height = Math.round(r.height*dpr);
  gCtx.setTransform(dpr,0,0,dpr,0,0);
  return {w:r.width, h:r.height};
}

async function initMic(){
  const state = msg => { const el = $('gMicState'); if(el) el.textContent = msg; };

  // Reasons the browser will refuse before we even ask
  if(!window.isSecureContext){
    micOn = false;
    $('gNote').textContent = 'Tap to jump. The microphone needs the page opened over https:// or from localhost \u2014 browsers block it for files opened straight from a folder.';
    state('Microphone blocked: this page is not on https or localhost.');
    return false;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    micOn = false;
    $('gNote').textContent = 'Tap to jump. This browser has no microphone support.';
    state('Microphone not available in this browser.');
    return false;
  }

  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Browsers start the audio engine suspended until a real tap. Without this
    // the analyser returns pure silence and nothing ever jumps.
    if(micCtx.state === 'suspended') await micCtx.resume();
    const src = micCtx.createMediaStreamSource(micStream);
    micAn = micCtx.createAnalyser(); micAn.fftSize = 1024;
    micBuf = new Uint8Array(micAn.fftSize);
    src.connect(micAn);
    micOn = true;
    state('Listening to the room\u2026');
    await calibrate();
    $('gNote').textContent = 'Microphone on. Nothing is recorded \u2014 only how loud it is right now.';
    state('Microphone ready. Shout and the bar should fill.');
    micWatch();
    return true;
  }catch(e){
    micOn = false;
    const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
    $('gNote').textContent = denied
      ? 'Microphone permission was refused, so tap the picture to jump instead.'
      : 'No microphone found, so tap the picture to jump instead.';
    state(denied ? 'Permission refused. Tap "Turn on the microphone" to ask again.'
                 : 'No microphone detected (' + (e && e.name ? e.name : 'unknown') + ').');
    return false;
  }
}

/* keep showing the live level even before a game starts, so anyone can
   see at a glance whether the kiosk is hearing them at all */
let micWatchTimer = null;
function micWatch(){
  clearInterval(micWatchTimer);
  micWatchTimer = setInterval(() => {
    if(!micOn){ clearInterval(micWatchTimer); return; }
    if(gRunning) return;                       // the game drives the meter itself
    const lv = level();
    const bar = $('gMeter'); if(bar) bar.style.width = Math.round(lv*100) + '%';
    const el = $('gMicState');
    if(el && !gRunning) el.textContent = loudNow()
      ? 'Hearing you \u2014 that would jump.'
      : 'Microphone ready. Say anything and the bar should pass the white line.';
  }, 100);
}

function stopMic(){
  clearInterval(micWatchTimer); micWatchTimer = null;
  if(micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if(micCtx){ micCtx.close(); micCtx = null; }
  micAn = null; micOn = false;
}
/* learn how noisy the gallery already is, so the floor's own din does not jump for you */
function calibrate(){
  return new Promise(res => {
    const samples = [];
    const t = setInterval(() => samples.push(rawLevel()), 60);
    setTimeout(() => {
      clearInterval(t);
      samples.sort((a,b) => a-b);
      micFloor = samples[Math.floor(samples.length*0.5)] || 0.02;
      markMeter();
      res();
    }, 1200);
  });
}
function rawLevel(){
  if(!micAn) return 0;
  micAn.getByteTimeDomainData(micBuf);
  let sum = 0;
  for(let i=0;i<micBuf.length;i++){ const v=(micBuf[i]-128)/128; sum += v*v; }
  return Math.sqrt(sum/micBuf.length);
}

/* How loud counts as a shout has to be relative, not a fixed number.
   A quiet gallery and a gallery with forty children in it differ by more
   than a child's voice does, so the floor is tracked continuously and the
   trigger sits a multiple above whatever the room is doing right now. */
let micFloor = 0.02;
let micSens = 1.9;          // the slider moves this
const MIC_MIN = 0.012;      // absolute floor, so silence never triggers

function micUpdate(raw){
  // falls quickly toward quiet, rises very slowly, so one shout cannot
  // drag the baseline up and lock you out of your own next shout
  if(raw < micFloor*1.5) micFloor = micFloor*0.97  + raw*0.03;   // settles quickly toward quiet
  else                   micFloor = micFloor*0.993 + raw*0.007;  // climbs when the hall fills up
  micFloor = Math.max(0.004, micFloor);
}
/* A single noisy frame is not a shout. In a hall full of children the
   background alone spikes past any threshold now and then, so the level
   has to hold for two frames running before it counts. */
let micHold = 0;
function isLoud(raw){
  const over = raw > Math.max(MIC_MIN, micFloor*micSens);
  micHold = over ? micHold + 1 : 0;
  return micHold >= 2;
}

/* 0 to 1 for the meter, where 1 is comfortably past the trigger */
function level(){
  if(!micOn) return holding ? 1 : 0;
  const raw = rawLevel();
  micUpdate(raw);
  const trig = Math.max(MIC_MIN, micFloor*micSens);
  return Math.max(0, Math.min(1, raw / (trig*1.6)));
}
function loudNow(){
  if(!micOn) return holding;
  return isLoud(rawLevel());
}
function markMeter(){
  const el = $('gMark');
  if(el) el.style.left = Math.round(100/1.6) + '%';   // where the trigger sits on the bar
}

function addBump(x){
  const wide = Math.random() < gL.wide;
  gRocks.push({x, w:(wide?52:22) + Math.random()*10, h: gL.hMin + Math.random()*14, passed:false, wide});
}

// Reset the player, obstacles, score, and canvas dimensions for a new level.
function setLevel(n){
  gLevel = n;
  gL = levelOf(n);
  gSpeed = gL.speed;
  gCleared = 0;
  gRocks = [];
  const {w,h} = fitCanvas();
  gPlayer = {x: Math.max(60, w*0.17), y: h - GROUND, vy:0, r:18, onGround:true};
  jumpCool = 0; wasLoud = false; jumpsLeft = 1;
  addBump(w + 300); addBump(w + 300 + gL.every);
  $('gLevel').textContent = `Level ${n}`;
  $('gScore').textContent = `0 / ${gL.target}`;
  const best = Number(store(KEY_GAME, 0)) || 0;
  $('gBest').textContent = best ? `Best today: level ${best}` : '';
}

function startGame(){
  gRunning = true;
  $('gOver').classList.remove('on');
  setLevel(1);
  gLast = performance.now();
  cancelAnimationFrame(gRaf);
  gRaf = requestAnimationFrame(gLoop);
}

function gLoop(now){
  if(!gRunning) return;
  const dt = Math.min(0.034, (now - gLast)/1000);
  gLast = now;
  const r = gCv.getBoundingClientRect();
  const w = r.width, h = r.height, ground = h - GROUND;
  const lv = level();
  $('gMeter').style.width = Math.round(lv*100) + '%';

  // A fresh shout jumps from the ground or gives one extra mid-air boost.
  const loud = loudNow();
  // On the ground any shout hops, so a child who screams non-stop keeps bouncing.
  // In the air only a fresh shout gives the second push, and holding the shout
  // while still rising softens gravity, so a longer scream jumps higher.
  if(loud && jumpCool <= 0 && (gPlayer.onGround || (!wasLoud && jumpsLeft > 0))){
    gPlayer.vy = -JUMP.jump * (gPlayer.onGround ? 1 : 0.8);
    if(!gPlayer.onGround) jumpsLeft--;
    gPlayer.onGround = false;
    jumpCool = JUMP.cooldown;
  }
  wasLoud = loud;

  if(!gPlayer.onGround){
    const g = (loud && gPlayer.vy < 0) ? JUMP.gravity*JUMP.hold : JUMP.gravity;
    gPlayer.vy += g*dt;
    gPlayer.y  += gPlayer.vy*dt;
    if(gPlayer.y < gPlayer.r*2){ gPlayer.y = gPlayer.r*2; gPlayer.vy = 0; }
    if(gPlayer.y >= ground){ gPlayer.y = ground; gPlayer.vy = 0; gPlayer.onGround = true; jumpsLeft = 1; }
  }

  // Obstacles move left past a mostly stationary player.
  gRocks.forEach(o => { o.x -= gSpeed*dt; });
  if(gRocks.length && gRocks[gRocks.length-1].x < w - gL.every) addBump(w + 30);
  gRocks = gRocks.filter(o => o.x > -90);

  for(const o of gRocks){
    if(!o.passed && o.x + o.w < gPlayer.x - gPlayer.r){
      o.passed = true;
      gCleared++;
      $('gScore').textContent = `${gCleared} / ${gL.target}`;
      if(gCleared >= gL.target) return levelUp();
    }
    const nearX = gPlayer.x + gPlayer.r > o.x && gPlayer.x - gPlayer.r < o.x + o.w;
    if(nearX && gPlayer.y > ground - o.h + 5) return gameOver();   // +5 forgives a graze
  }

  gDraw(w, h, ground);
  gRaf = requestAnimationFrame(gLoop);
}

function gDraw(w, h, ground){
  const c = gCtx;
  c.clearRect(0,0,w,h);
  const sky = c.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#124454'); sky.addColorStop(1,'#0A2530');
  c.fillStyle = sky; c.fillRect(0,0,w,h);

  c.fillStyle = '#0E3341'; c.fillRect(0, ground, w, h-ground);
  c.strokeStyle = '#2C6377'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(0,ground); c.lineTo(w,ground); c.stroke();

  // Wide rocks are drawn differently so their increased risk is visible.
  gRocks.forEach(o => {
    c.fillStyle = o.wide ? '#1C5568' : '#17495A';
    c.strokeStyle = '#2C6377'; c.lineWidth = 2;
    roundRect(c, o.x, ground - o.h, o.w, o.h, 7); c.fill(); c.stroke();
    c.fillStyle = 'rgba(242,166,59,.55)';
    c.fillRect(o.x+4, ground - o.h + 4, o.w - 8, 3);
  });

  const airborne = !gPlayer.onGround;
  c.save();
  c.translate(gPlayer.x, gPlayer.y - gPlayer.r);
  c.rotate(airborne ? Math.max(-0.3, Math.min(0.3, gPlayer.vy/1400)) : 0);
  if(gSprite && gSprite.complete){
    const size = gPlayer.r*3.4;
    c.drawImage(gSprite, -size/2, -size + gPlayer.r, size, size);
  }else{
    c.fillStyle = '#EAF3F2';
    c.beginPath(); c.arc(0, -gPlayer.r/2, gPlayer.r, 0, Math.PI*2); c.fill();
  }
  c.restore();
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}

function levelUp(){

  cancelAnimationFrame(gRaf);

function gameOver(){

/* =====================================================================
   ZINION BULBS — the bulbs light in an order, you repeat it.
   Every bulb belongs to a Zinion, who cheers when you get the round right.
   ===================================================================== */
const KEY_BULB = 'parsec_wf_bulb_best';
const BULB_ZIN = ['tropido','niki','stephen','argon','harsh'];
let bulbSeq = [], bulbStep = 0, bulbRound = 0, bulbBusy = false, bulbTimers = [];

function bulbEls(){ return [...document.querySelectorAll('#bulbRow .bulb')]; }
function bulbClearTimers(){ bulbTimers.forEach(clearTimeout); bulbTimers = []; }
function bulbLater(fn, ms){ bulbTimers.push(setTimeout(fn, ms)); }

function bulbFlash(i, cls, on, off){
  const el = bulbEls()[i];
  if(!el) return;
  bulbLater(() => el.classList.add(cls || 'lit'), on);
  bulbLater(() => el.classList.remove(cls || 'lit'), off);
}

function bulbSay(text, tone){
  const el = $('bulbSay');
  el.textContent = text;
  el.className = 'bulbsay' + (tone ? ' ' + tone : '');
}

function bulbReset(){
  bulbClearTimers();
  bulbEls().forEach(el => el.classList.remove('lit','wrong','dead'));
  $('bulbRow').classList.remove('bulbs-lock');
  bulbSeq = []; bulbStep = 0; bulbRound = 0; bulbBusy = false;
  $('bulbRound').textContent = 'Round 1';
  const best = Number(store(KEY_BULB, 0)) || 0;
  $('bulbBest').textContent = best ? `Best today: round ${best}` : '';
  bulbSay('Watch which bulbs light up.');
  $('bulbStart').textContent = 'Start';
}

function bulbNextRound(){
  bulbRound++;
  bulbStep = 0;
  bulbSeq.push(Math.floor(Math.random() * bulbEls().length));
  $('bulbRound').textContent = `Round ${bulbRound}`;
  bulbPlay();
}

function bulbPlay(){
  bulbBusy = true;
  $('bulbRow').classList.add('bulbs-lock');
  bulbSay('Watch\u2026');
  const gap = Math.max(360, 620 - bulbRound * 22);   // speeds up as rounds go on
  bulbSeq.forEach((b, i) => bulbFlash(b, 'lit', 500 + i*gap, 500 + i*gap + gap*0.62));
  bulbLater(() => {
    bulbBusy = false;
    $('bulbRow').classList.remove('bulbs-lock');
    bulbSay('Your turn.', 'go');
  }, 500 + bulbSeq.length*gap + 120);
}

function bulbTap(i){
  if(bulbBusy || !bulbSeq.length) return;
  const el = bulbEls()[i];
  el.classList.add('lit');
  setTimeout(() => el.classList.remove('lit'), 220);

  if(i === bulbSeq[bulbStep]){
    bulbStep++;
    if(bulbStep === bulbSeq.length){
      bulbBusy = true;
      $('bulbRow').classList.add('bulbs-lock');
      const z = BULB_ZIN[i] || 'stephen';
      bulbSay(`${HOST_NAME[z]} says yes!`, 'go');
      bulbLater(bulbNextRound, 900);
    }
  }else{
    bulbOver(i);
  }
}

function bulbOver(i){
  bulbBusy = true;
  bulbClearTimers();
  $('bulbRow').classList.add('bulbs-lock');
  const el = bulbEls()[i];
  el.classList.add('wrong');
  setTimeout(() => el.classList.remove('wrong'), 700);
  bulbEls().forEach((b, n) => { if(n !== bulbSeq[bulbStep]) b.classList.add('dead'); });
  bulbLater(() => bulbEls().forEach(b => b.classList.remove('dead')), 900);

  const reached = bulbRound - 1;
  const best = Number(store(KEY_BULB, 0)) || 0;
  if(reached > best) save(KEY_BULB, reached);
  $('bulbBest').textContent = `Best today: round ${Math.max(best, reached)}`;
  bulbSay(reached < 1 ? 'That was the wrong one. Try again.'
                      : `You held ${reached} round${reached === 1 ? '' : 's'}. Go again?`, 'bad');
  $('bulbStart').textContent = 'Go again';
  bulbLater(() => { bulbBusy = false; }, 900);
}

function openBulbs(){ show('bulbs'); bulbReset(); }
function bulbBegin(){ bulbReset(); bulbLater(bulbNextRound, 300); }



/* =====================================================================
   ZINION PUZZLE — a sliding tile puzzle made from the Zinion artwork.
   Shuffled by legal moves only, so every board can always be solved.
   ===================================================================== */
const KEY_PUZ = 'parsec_wf_puzzle_best';
const PUZ_KEYS = ['tropido','niki','stephen','argon','harsh'];
let puzN = 3, puzLevel = 2, puzChar = 'tropido', puzTiles = [], puzBlank = 0, puzMoves = 0, puzLive = false, puzTry = 0, puzAdvanceTimer = null;
const PUZ_SQUARE = {};   // square versions of each mascot, made once
const PUZ_LEVEL_STEPS = [12, 40, 90];

/* the artwork is tall and transparent, so square it off first
   or the pieces come out stretched and unreadable */
function squareUp(key){
  return new Promise(res => {
    if(PUZ_SQUARE[key]) return res(PUZ_SQUARE[key]);
    const img = new Image();
    img.onload = () => {
      const S = 600;
      const c = document.createElement('canvas');
      c.width = S; c.height = S;
      const x = c.getContext('2d');
      x.fillStyle = '#17495A'; x.fillRect(0, 0, S, S);
      const k = Math.min(S*0.94 / img.width, S*0.94 / img.height);
      const w = img.width*k, h = img.height*k;
      x.drawImage(img, (S-w)/2, (S-h)/2, w, h);
      PUZ_SQUARE[key] = c.toDataURL('image/png');
      res(PUZ_SQUARE[key]);
    };
    img.onerror = () => res(null);
    img.src = MASCOT[key];
  });
}

function puzBestKey(){ return `${puzChar}:${puzN}:${puzLevel}`; }
function puzShowBest(){
  const all = store(KEY_PUZ, {});
  const b = all[puzBestKey()];
  $('puzBest').textContent = b ? b + ' moves' : '\u2014';
}

async function puzBuild(shuffle){
  const src = await squareUp(puzChar);
  const n = puzN, total = n*n;
  if(shuffle || !puzTiles.length){
    puzTiles = Array.from({length: total}, (_, i) => i);
    puzBlank = total - 1;
    // Shuffle by legal moves only, so the board is always solvable.
    // The step count must be random: a fixed count on a 2x2 walks the blank
    // in a 4-move loop and lands right back on the solved board every time.
    let last = -1;
    const steps = total*PUZ_LEVEL_STEPS[puzLevel - 1] + Math.floor(Math.random() * (total*8 + 7));
    for(let i = 0; i < steps; i++){
      const opts = puzNeighbours(puzBlank).filter(x => x !== last);
      const pick = opts[Math.floor(Math.random()*opts.length)];
      last = puzBlank;
      puzTiles[puzBlank] = puzTiles[pick];
      puzTiles[pick] = total - 1;
      puzBlank = pick;
    }
    if(puzSolved() && (puzTry = (puzTry||0) + 1) < 12) return puzBuild(true);  // reshuffle if it landed solved
    puzTry = 0;
    puzMoves = 0;
    $('puzMoves').textContent = '0';
    $('puzSay').textContent = 'Slide the pieces until the Zinion is whole again.';
    $('puzSay').className = 'puzsay';
    puzLive = true;
  }
  const complete = !shuffle && puzSolved();
  const board = $('puzBoard');
  board.classList.toggle('done', complete);
  board.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  board.innerHTML = '';
  puzTiles.forEach((tile, pos) => {
    const d = document.createElement('div');
    const isBlank = (tile === total - 1) && !complete;   // once solved, the gap fills in
    d.className = 'ptile' + (isBlank ? ' blank' : '');
    if(complete && tile === total - 1) d.classList.add('lastpiece');
    if(!isBlank && src){
      const r = Math.floor(tile / n), c = tile % n;
      d.style.backgroundImage = `url(${src})`;
      d.style.backgroundSize = `${n*100}% ${n*100}%`;
      d.style.backgroundPosition = `${(c/(n-1))*100}% ${(r/(n-1))*100}%`;
      d.innerHTML = `<span>${tile+1}</span>`;
    }
    d.addEventListener('click', () => puzTap(pos));
    board.appendChild(d);
  });
  puzShowBest();
}

function puzNeighbours(i){
  const n = puzN, r = Math.floor(i/n), c = i % n, out = [];
  if(r > 0) out.push(i-n);
  if(r < n-1) out.push(i+n);
  if(c > 0) out.push(i-1);
  if(c < n-1) out.push(i+1);
  return out;
}

function puzSolved(){ return puzTiles.every((t, i) => t === i); }

async function puzTap(pos){
  if(!puzLive) return;
  if(!puzNeighbours(puzBlank).includes(pos)) return;
  puzTiles[puzBlank] = puzTiles[pos];
  puzTiles[pos] = puzN*puzN - 1;
  puzBlank = pos;
  puzMoves++;
  $('puzMoves').textContent = puzMoves;

  const won = puzSolved();
  if(won) puzLive = false;          // stop further taps before the redraw lands
  await puzBuild(false);            // must finish before the win is drawn
  if(won) puzWin();
}

function puzWin(){
  puzLive = false;                  // the board is already drawn complete by puzBuild
  const all = store(KEY_PUZ, {});
  const k = puzBestKey();
  const isBest = !all[k] || puzMoves < all[k];
  if(isBest){ all[k] = puzMoves; save(KEY_PUZ, all); }
  puzShowBest();
  $('puzSay').textContent = isBest
    ? `Back together in ${puzMoves} moves \u2014 best today!`
    : `Back together in ${puzMoves} moves.`;
  $('puzSay').className = 'puzsay win';
  say(`${HOST_NAME[puzChar]} is whole again!`, 4000);
  if(puzLevel < 3){
    // Give the solved board a brief moment, then move to the next difficulty.
    puzAdvanceTimer = setTimeout(() => {
      if(!$('puzzle').classList.contains('on')) return;
      puzLevel++;
      document.querySelectorAll('.puzlevel').forEach(b =>
        b.classList.toggle('on', Number(b.dataset.level) === puzLevel));
      puzBuild(true);
    }, 1100);
  }
}

function puzOpen(){
  show('puzzle');
  const pick = $('puzPick');
  pick.innerHTML = '';
  PUZ_KEYS.forEach(k => {
    const b = document.createElement('button');
    b.className = 'puzchar' + (k === puzChar ? ' on' : '');
    b.innerHTML = `<img src="${MASCOT[k]}" alt="${HOST_NAME[k]}">`;
    b.addEventListener('click', () => {
      puzChar = k;
      [...pick.children].forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      puzBuild(true);
    });
    pick.appendChild(b);
  });
  puzBuild(true);
}




/* =====================================================================
   WIND TUNNEL — hold to run the fan. Moving air lifts the balloon and
   pushes it along; let go and it sinks and slows. The fan has a limit,
   so it has to be used in bursts rather than held down.
   ===================================================================== */
const KEY_WIND = 'parsec_wf_wind_best';

/* Two fan strengths. Lift stays a fixed multiple of gravity and the
   recharge always sustains the duty cycle hovering needs \u2014 otherwise
   staying up becomes impossible however skilled the player is. */
const FANS = {
  gentle: {mult:2.1, drain:22, recharge:24},
  strong: {mult:2.6, drain:26, recharge:22}
};
let fanKind = 'gentle';

// Derive physics and gate spacing from the level so difficulty grows together.
function windLevel(n){
  const f = FANS[fanKind];
  const gravity = 250 + 10*(n-1);
  return {
    gravity, lift: gravity*f.mult, vyMax:150,
    vxMin: 40 + 3*(n-1), vxMax: 100 + 7*(n-1), accel:40, drag:50,
    drain: f.drain, recharge: f.recharge,
    gap: Math.max(145, 220 - 9*(n-1)),
    every: Math.max(300, 420 - 16*(n-1)),
    target: 4 + n
  };
}

let wCv, wCtx, wRaf = null, wRunning = false, wLast = 0;
let wBall, wGates, wPower, wLevel, wL, wPassed, wHold = false;

function windFit(){
  const r = wCv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  wCv.width = Math.round(r.width*dpr); wCv.height = Math.round(r.height*dpr);
  wCtx.setTransform(dpr,0,0,dpr,0,0);
  return {w:r.width, h:r.height};
}

// Gates remember their position and whether the balloon has already passed.
function addGate(x, h){
  wGates.push({x, gap:wL.gap, top: 40 + Math.random()*(h - wL.gap - 80), done:false});
}
function windSet(n){
  wLevel = n; wL = windLevel(n);
  const {w,h} = windFit();
  wBall = {x: Math.max(56, w*0.16), y: h/2, vy:0, vx: wL.vxMin, r:16};
  wGates = []; wPower = 100; wPassed = 0;
  addGate(w + 120, h); addGate(w + 120 + wL.every, h);
  $('wLevel').textContent = `Level ${n}`;
  $('wGates').textContent = `0 / ${wL.target}`;
  const best = Number(store(KEY_WIND, 0)) || 0;
  $('wBest').textContent = best ? `Best today: level ${best}` : '';
}
function windStart(){
  wRunning = true;
  $('wOver').classList.remove('on');
  windSet(1);
  wLast = performance.now();
  cancelAnimationFrame(wRaf);
  wRaf = requestAnimationFrame(windLoop);
}

function windLoop(now){
  if(!wRunning) return;
  const dt = Math.min(0.034, (now - wLast)/1000);
  wLast = now;
  const r = wCv.getBoundingClientRect();
  const w = r.width, h = r.height;

  // Holding spends fan power; releasing slows the balloon and recharges it.
  const fanning = wHold && wPower > 0.5;
  if(fanning){
    wPower = Math.max(0, wPower - wL.drain*dt);
    wBall.vy -= wL.lift*dt;
    wBall.vx = Math.min(wL.vxMax, wBall.vx + wL.accel*dt);
  }else{
    wPower = Math.min(100, wPower + wL.recharge*dt);
    wBall.vx = Math.max(wL.vxMin, wBall.vx - wL.drag*dt);
  }
  $('wFan').style.width = wPower + '%';
  $('wFanBar').classList.toggle('low', wPower < 25);

  wBall.vy += wL.gravity*dt;
  wBall.vy = Math.max(-wL.vyMax, Math.min(wL.vyMax, wBall.vy));
  wBall.y += wBall.vy*dt;
  if(wBall.y < wBall.r){ wBall.y = wBall.r; wBall.vy = 0; }
  if(wBall.y > h - wBall.r) return windOver('It touched the ground.');

  // The balloon stays near the left side while the tunnel moves toward it.
  wGates.forEach(g => { g.x -= wBall.vx*dt; });
  if(wGates.length && wGates[wGates.length-1].x < w - wL.every) addGate(w + 20, h);
  wGates = wGates.filter(g => g.x > -50);

  for(const g of wGates){
    if(!g.done && g.x + 22 < wBall.x - wBall.r){
      g.done = true; wPassed++;
      $('wGates').textContent = `${wPassed} / ${wL.target}`;
      if(wPassed >= wL.target) return windUp();
    }
    const nearX = wBall.x + wBall.r > g.x && wBall.x - wBall.r < g.x + 22;
    if(nearX && (wBall.y - wBall.r < g.top || wBall.y + wBall.r > g.top + g.gap))
      return windOver('Clipped the edge.');
  }

  windDraw(w, h, fanning);
  wRaf = requestAnimationFrame(windLoop);
}

function windDraw(w, h, fanning){
  const c = wCtx;
  c.clearRect(0,0,w,h);
  const sky = c.createLinearGradient(0,0,0,h);
  sky.addColorStop(0,'#124454'); sky.addColorStop(1,'#0A2530');
  c.fillStyle = sky; c.fillRect(0,0,w,h);

  // the fan at the bottom left, and its airflow when running
  const fx = 26, fy = h - 26;
  c.strokeStyle = fanning ? '#F2A63B' : '#2C6377';
  c.lineWidth = 3;
  c.beginPath(); c.arc(fx, fy, 15, 0, Math.PI*2); c.stroke();
  c.beginPath(); c.moveTo(fx, fy); c.lineTo(fx, fy-15);
  c.moveTo(fx, fy); c.lineTo(fx+13, fy+7);
  c.moveTo(fx, fy); c.lineTo(fx-13, fy+7); c.stroke();

  if(fanning){
    c.strokeStyle = 'rgba(242,166,59,.4)'; c.lineWidth = 2;
    for(let i=0;i<4;i++){
      const yy = wBall.y + 40 + i*22 + ((performance.now()/9 + i*30) % 22);
      if(yy > h) continue;
      c.beginPath(); c.moveTo(wBall.x - 16, yy); c.lineTo(wBall.x + 16, yy - 7); c.stroke();
    }
  }

  wGates.forEach(g => {
    c.fillStyle = '#17495A'; c.strokeStyle = '#2C6377'; c.lineWidth = 2;
    roundRect(c, g.x, -12, 22, g.top + 12, 8); c.fill(); c.stroke();
    roundRect(c, g.x, g.top + g.gap, 22, h - (g.top+g.gap) + 12, 8); c.fill(); c.stroke();
    c.fillStyle = 'rgba(242,166,59,.5)';
    c.fillRect(g.x+3, g.top-4, 16, 3);
    c.fillRect(g.x+3, g.top+g.gap+1, 16, 3);
  });

  // the balloon
  c.fillStyle = '#F2A63B';
  c.beginPath(); c.ellipse(wBall.x, wBall.y, wBall.r, wBall.r*1.15, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = '#10222A';
  c.beginPath(); c.moveTo(wBall.x-4, wBall.y+wBall.r*1.1);
  c.lineTo(wBall.x+4, wBall.y+wBall.r*1.1); c.lineTo(wBall.x, wBall.y+wBall.r*1.5); c.closePath(); c.fill();
}

function windUp(){
  wRunning = false;
  cancelAnimationFrame(wRaf);
  const best = Number(store(KEY_WIND, 0)) || 0;
  if(wLevel > best) save(KEY_WIND, wLevel);
  const next = wLevel + 1;
  $('wOverTitle').textContent = `Level ${wLevel} cleared!`;
  $('wOverText').textContent = next === 5
    ? 'The gaps get narrow from here. Short bursts of fan, and let it sink between them.'
    : 'Narrower gaps and faster air from here.';
  $('wStart').textContent = `Start level ${next}`;
  $('wStart').onclick = () => {
    wRunning = true;
    $('wOver').classList.remove('on');
    windSet(next);
    wLast = performance.now();
    wRaf = requestAnimationFrame(windLoop);
  };
  $('wOver').classList.add('on');
  say(`Level ${wLevel} cleared!`, 3000);
}

function windOver(why){
  if(!wRunning) return;
  wRunning = false;
  cancelAnimationFrame(wRaf);
  const best = Number(store(KEY_WIND, 0)) || 0;
  if(wLevel > best) save(KEY_WIND, wLevel);
  $('wBest').textContent = `Best today: level ${Math.max(best, wLevel)}`;
  $('wOverTitle').textContent = why;
  $('wOverText').textContent = wPassed === 0
    ? 'Hold to lift, let go to sink. Letting go also slows you down, which gives you time to aim.'
    : `Level ${wLevel}: ${wPassed} of ${wL.target} gaps. Short bursts beat holding it down \u2014 the fan runs out.`;
  $('wStart').textContent = 'Try level 1 again';
  $('wStart').onclick = windStart;
  $('wOver').classList.add('on');
}

function windOpen(){
  show('wind');
  wCv = $('windCanvas'); wCtx = wCv.getContext('2d');
  $('wOverTitle').textContent = 'Wind Tunnel';
  $('wOverText').textContent = 'Hold anywhere to run the fan. Air pushes the balloon up and pushes it along faster. Let go and it sinks, and slows down \u2014 which is how you line up a gap.';
  $('wStart').textContent = 'Start level 1';
  $('wStart').onclick = windStart;
  $('wOver').classList.add('on');
  windFit(); windSet(1);
  const r = wCv.getBoundingClientRect();
  windDraw(r.width, r.height, false);
}

// Pointer and keyboard input share one flag across touch, mouse, and spacebar.
function windLeave(){ wRunning = false; cancelAnimationFrame(wRaf); wHold = false; }

['pointerdown','touchstart'].forEach(e =>
  $('wind') && $('wind').addEventListener(e, () => { wHold = true; }, {passive:true}));
['pointerup','pointercancel','touchend','touchcancel'].forEach(e =>
  document.addEventListener(e, () => { wHold = false; }, {passive:true}));
document.addEventListener('keydown', e => { if(e.key === ' ' && $('wind').classList.contains('on')) wHold = true; });
document.addEventListener('keyup',   e => { if(e.key === ' ') wHold = false; });
window.addEventListener('resize', () => { if($('wind').classList.contains('on')) windFit(); });

/* ---------- idle reset ---------- */
let idleTimer;
function resetIdle(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    // never wipe someone mid-typing, or a name already entered on the start screen
    if(document.activeElement === $('nameInput')){ resetIdle(); return; }
    if($('start').classList.contains('on') && $('nameInput').value.trim()){ resetIdle(); return; }
    clearTimers(); player=''; $('nameInput').value=''; show('start');
  }, IDLE_RESET_SEC*1000);
}
['click','keydown','keyup','input','touchstart','touchmove','pointerdown','focusin']
  .forEach(e => document.addEventListener(e, resetIdle, {passive:true}));
resetIdle();

/* ---------- wiring ---------- */
$('nameGo').addEventListener('click', goPick);
$('nameInput').addEventListener('keydown', e => { if(e.key === 'Enter') goPick(); });
$('backName').addEventListener('click', () => show('mode'));
$('modeBack').addEventListener('click', () => { $('nameInput').value=''; show('start'); });
$('modeQuiz').addEventListener('click', () => show('pick'));
$('modeGame').addEventListener('click', openGame);
$('gSens').addEventListener('input', e => {
  micSens = Number(e.target.value)/100;
  $('gMicState').textContent = `Sensitivity ${micSens.toFixed(2)}\u00d7 the room's own noise.`;
});
$('gRecal').addEventListener('click', async () => {
  if(!micOn){ $('gMicState').textContent = 'Microphone is not on yet.'; return; }
  $('gMicState').textContent = 'Listening to the room, stay quiet for a second\u2026';
  await calibrate();
  $('gMicState').textContent = 'Done. Say anything and the bar should pass the white line.';
});
$('gMicBtn').addEventListener('click', async () => {
  $('gMicState').textContent = 'Asking the browser\u2026';
  stopMic();
  await initMic();
});
$('modeBulbs').addEventListener('click', openBulbs);
$('modePuzzle').addEventListener('click', puzOpen);
$('modeWind').addEventListener('click', windOpen);

document.querySelectorAll('.fanbtn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.fanbtn').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); fanKind = b.dataset.f;
  if(!wRunning) windSet(1);
}));
$('puzShuffle').addEventListener('click', () => puzBuild(true));

document.querySelectorAll('.puzsize').forEach(b =>
  b.addEventListener('click', () => {
    document.querySelectorAll('.puzsize').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    puzN = Number(b.dataset.n);
    puzBuild(true);
  }));
document.querySelectorAll('.puzlevel').forEach(b =>
  b.addEventListener('click', () => {
    document.querySelectorAll('.puzlevel').forEach(x => x.classList.remove('on'));
