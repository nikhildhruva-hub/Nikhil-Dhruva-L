 explain:"It is moulded in. A printed sticker is the commonest sign of a helmet that will not protect you \u2014 it exists to get past a traffic stop.",
 wonder:"Why would anyone sell a helmet that does not work?"},
{zone:"road",q:"You drop your helmet hard in a crash but it looks undamaged. What should you do?",
 options:["Keep using it","Replace it","Repaint it","Only replace it if cracked"],answer:1,
 explain:"Replace it. The foam liner works by crushing, and it only crushes once. From the outside you cannot tell it has already been used up.",
 wonder:"If the foam crushes to protect you, what is it protecting you from exactly?"},
{zone:"road",q:"What happens to a helmet worn with the chin strap unfastened?",
 options:["It works normally","It comes off in the first moment of a crash","It works if it fits well","It protects the top only"],answer:1,
 explain:"It leaves your head almost immediately, before the impact that matters. An unfastened helmet is a hat.",
 wonder:"Why is the strap under the jaw rather than around the forehead?"},
{zone:"road",q:"A friend has had a couple of drinks and says he is fine to ride home. What actually helps?",
 options:["Let him go slowly","Get him a ride and keep the keys","Give him coffee first","Follow behind him"],answer:1,
 explain:"Nothing sobers a person up except time. Coffee makes a drunk person alert and still drunk. The only thing that works is not letting them ride.",
 wonder:"Why is it so hard to say that to a friend, and what could you say instead?"},
{zone:"road",q:"Alcohol makes driving dangerous mainly because it\u2026",
 options:["Blurs your vision only","Slows your reaction and spoils your judgement","Makes you drive slower","Affects only heavy drinkers"],answer:1,
 explain:"It lengthens the gap between seeing something and acting, and it weakens the correction you then make. People also judge themselves as fine while both are happening.",
 wonder:"If you cannot feel it happening, how would you ever know?"},
{zone:"road",q:"A microsleep is\u2026",
 options:["A short nap you choose to take","A few seconds of sleep you do not notice","Feeling drowsy but awake","Sleeping with your eyes shut"],answer:1,
 explain:"A few seconds of real sleep that you do not know you had. Your eyes can even stay open. At highway speed a four-second microsleep covers well over a hundred metres.",
 wonder:"What would the road look like to you when you came back?"},
{zone:"road",q:"If you double your speed, the distance needed to brake to a stop roughly\u2026",
 options:["Stays the same","Doubles","Goes up four times","Halves"],answer:2,
 explain:"Braking distance grows with the square of speed, so twice the speed needs about four times the distance. This is why a small increase in speed matters so much.",
 wonder:"Where is all that extra energy going when you brake?"},
{zone:"road",q:"Reading one message takes your eyes off the road for about five seconds. At 50 km/h, how far do you travel in that time?",
 options:["About 7 metres","About 20 metres","About 70 metres","About 200 metres"],answer:2,
 explain:"50 km/h is just under 14 metres every second, so five seconds is around 70 metres \u2014 travelled completely blind.",
 wonder:"Would you walk 70 metres down a road with your eyes shut?"},
{zone:"road",q:"Who has to wear a helmet on a two-wheeler in India?",
 options:["The rider only","The rider and the pillion","Only on highways","Only above 50 km/h"],answer:1,
 explain:"Both. The law covers the pillion rider as well, and a pillion in a crash is thrown just as hard as the person in front.",
 wonder:"Why do you think the pillion is so often the one without a helmet?"},
{zone:"road",q:"Your phone buzzes while you are riding. What is the safe thing to do?",
 options:["Check it at the next signal","Answer on speaker","Leave it until you have stopped somewhere safe","Check it quickly on a straight road"],answer:2,
 explain:"A stopped signal is still a road with people moving around you, and a hands-free call takes your attention just as much as a handheld one. The message will wait.",
 wonder:"How many messages have ever been worth arriving late for, let alone not arriving?"},
{zone:"road",q:"You are on a long drive and start feeling drowsy. What actually works?",
 options:["Loud music","Cold air from the window","Stopping and resting","Coffee and carrying on"],answer:2,
 explain:"Music and cold air do nothing for sleep pressure \u2014 they only hide it for a few minutes. Stopping is the only thing that fixes it. Fifteen minutes off the road beats two hours of fighting it.",
 wonder:"Why does your body insist on sleeping even when you have decided not to?"},
{zone:"road",q:"A dog runs into the road ahead of you. What is usually safest?",
 options:["Swerve hard around it","Brake firmly and stay in your lane","Speed up past it","Sound the horn and keep going"],answer:1,
 explain:"Swerving at speed is how riders lose control or move into the path of something worse. Brake hard in a straight line and keep your lane. Most of the danger is what you steer into, not what you steer around.",
 wonder:"Why does slowing down early give you so many more options than braking late?"},
{zone:"road",q:"Which of these makes the biggest difference to whether you walk away from a crash?",
 options:["Riding a newer bike","Wearing a certified helmet, fastened","Knowing the road well","Riding in daylight"],answer:1,
 explain:"Familiar roads and good light help, but the helmet is the one that is doing something at the moment it matters. It is also the only one entirely within your control every single time.",
 wonder:"What else about your journey is fully within your control?"},
{zone:"clock",q:"Why does an hour have 60 minutes rather than 100?",
 options:["It divides neatly by many numbers","Because of the Moon","A French decision","Nobody knows"],answer:0,
 explain:"The Babylonians counted in sixties, and 60 splits evenly into halves, thirds, quarters, fifths, sixths, tenths and more. Hard to improve on before calculators.",
 wonder:"What would a hundred-minute hour do to the way you split up a day?"},
{zone:"clock",q:"Why do clock hands go the way they do?",
 options:["A rule made by clockmakers","A sundial's shadow moves that way north of the equator","To match the stars","It was chosen at random"],answer:1,
 explain:"Mechanical clocks copied the sundial, and in the northern hemisphere the shadow sweeps that way. Built first in the southern hemisphere, clocks would very likely run the other way.",
 wonder:"So which way does a sundial's shadow move in Australia?"},
{zone:"clock",q:"What is one second actually measured against today?",
 options:["The Earth's spin","A swinging pendulum","The vibration of a caesium atom","The Sun crossing the sky"],answer:2,
 explain:"A fixed number of oscillations of a caesium atom. The Earth's spin turned out to be slightly irregular, so it was retired as the reference.",
 wonder:"What does it mean that our most reliable clock is a single atom?"},
{zone:"clock",q:"How long does Earth take to spin once relative to the distant stars?",
 options:["Exactly 24 hours","About 23 hours 56 minutes","About 25 hours","About 12 hours"],answer:1,
 explain:"About 23 hours 56 minutes. The extra four minutes to reach 24 hours is Earth catching up with its own movement around the Sun.",
 wonder:"So which of the two is the day your clock is actually keeping?"},
{zone:"clock",q:"In 12 hours, how many times do the hour and minute hands sit exactly on top of each other?",
 options:["12 times","11 times","24 times","10 times"],answer:1,
 explain:"Eleven. They meet just after 1:05, 2:10 and so on, but never at 11 o'clock \u2014 the next meeting is 12 itself.",
 wonder:"Why does one meeting go missing?"},
{zone:"clock",q:"India runs on one time zone for the whole country. What is its offset?",
 options:["Five hours ahead of UTC","Five and a half hours ahead","Six hours ahead","It varies by state"],answer:1,
 explain:"IST is five and a half hours ahead of UTC \u2014 one of a handful of half-hour zones in the world, set on a line near Mirzapur.",
 wonder:"What would change in Kohima and in Dwarka if India had two zones?"},
{zone:"clock",q:"Which of these years is NOT a leap year?",
 options:["2000","2020","1900","2024"],answer:2,
 explain:"1900 is not. A century year is only a leap year if it divides by 400, which is why 2000 was and 1900 was not.",
 wonder:"Why does the calendar need a rule this fiddly at all?"},
{zone:"clock",q:"The Caf\u00e9 Wall illusion makes rows of tiles appear to slope. What is actually true of them?",
 options:["They really do slope","They are perfectly parallel","They curve slightly","They move very slowly"],answer:1,
 explain:"Perfectly parallel. The staggered tiles and the mortar line between them fool the edge-detecting parts of your visual system. Knowing this does not stop you seeing it.",
 wonder:"What else might your eyes be inventing right now?"},
{zone:"clock",q:"If a clock showed the time as element symbols by atomic number, what would 26 be?",
 options:["Iron","Copper","Silver","Neon"],answer:0,
 explain:"Iron, atomic number 26. Every element has a number telling you how many protons sit in its nucleus, so any number can be written as a symbol.",
 wonder:"What would your age look like written as an element?"},
{zone:"clock",q:"Earth moves around the Sun at roughly what speed?",
 options:["About 3 km per second","About 30 km per second","About 300 km per second","About 3,000 km per second"],answer:1,
 explain:"About 30 kilometres every second \u2014 near enough 1,800 km in the time it takes to read this question.",
 wonder:"Why has nobody ever felt it?"}

let pick = null;   // { zid, branch, qs, i, counts, fields } while a round is running

/* The branch's questions in a fresh order, follow-on questions kept with their lead-in. */
function shuffleQuestions(qs){
  const groups = [];
  qs.forEach(q => q[2] && groups.length ? groups[groups.length - 1].push(q) : groups.push([q]));
  return shuffle(groups).flat();
}

function startPickRound(zid){
  pick = { zid, branch: null, qs: null, i: 0, counts: {}, fields: [] };
  const z = ZONES.find(z => z.id === zid);
  $('zoneName').textContent = z ? z.name : '';
  setHost(zid);
  show('quiz');
  stopClock(); timeLeft = TIMER_SECONDS; paintClock();
  renderPick();
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}

function renderPick(){
  clearTimers(); locked = false;
  const qs = pick.qs;
  const total = C2I_BANK[pick.zid][0].length;
  $('count').textContent = qs ? `Question ${pick.i + 1} of ${total}` : 'Before you start';
  $('fill').style.width = (qs ? (pick.i + 1) / total * 100 : 0) + '%';
  $('feedback').classList.remove('on');
  $('nextBtn').style.visibility = 'hidden';
  const box = $('opts');
  box.innerHTML = '';

  // Step 1: which branch.
  if(!qs){
    box.className = 'opts visits';
    $('question').textContent = 'Have you been through this gallery yet?';
    BRANCHES.forEach((b, n) => {
      const card = el('button', 'visit');
      card.append(el('span', 'visit-ico ' + (n ? 'done' : 'ahead')), el('b', '', b.label), el('span', 'visit-hint', b.hint));
      card.addEventListener('click', () => {
        pick.branch = n;
        pick.qs = shuffleQuestions(C2I_BANK[pick.zid][n]);
        pick.fields.push(['Visited before', b.label]);
        renderPick();
      });
      box.appendChild(card);
    });
    return;
  }

  // Step 2: one of the four questions, each on a fresh clock.
  startClock();
  box.className = 'opts';
  const [q, options] = qs[pick.i];
  $('question').textContent = q;
  shuffle(options).forEach(([tag, text, nameIt], n) => {
    const b = el('button', 'opt choice');
    b.append(el('span', 'optkey', 'ABCD'[n]), el('span', 'opttext', text));
    if(nameIt) b.appendChild(el('em', 'nameit', 'name it'));
    b.addEventListener('click', () => {
      if(locked) return;
      if(nameIt) return openWrite(b, `Name it — ${text.toLowerCase()}:`, false,
        v => answerPick(b, v ? `${text}: ${v}` : text, tag));
      answerPick(b, text, tag);
    });
    box.appendChild(b);
  });

  const own = el('button', 'opt own');
  own.append(el('span', 'optkey', '+'), el('span', 'opttext', 'Or write your own'));
  own.addEventListener('click', () => {
    if(locked) return;
    openWrite(own, 'Say it your way:', true, v => answerPick(own, `Own answer: ${v}`, 0));
  });
  box.appendChild(own);

  const skip = el('button', 'skiplink', 'Skip this question');
  skip.addEventListener('click', () => { if(!locked) answerPick(null, 'Skipped', 0); });
  box.appendChild(skip);
}

/* Opens a writing box below the options (always the same spot, so the option grid
   never reflows). For "Or write your own" the box takes that button's place. */
function openWrite(anchor, note, required, done){
  const box = $('opts');
  const old = box.querySelector('.writebox');
  if(old) old.remove();
  const own = box.querySelector('.opt.own');
  [...box.querySelectorAll('.opt')].forEach(o => o.classList.toggle('active', o === anchor));
  own.hidden = anchor === own;

  const wrap = el('div', 'writebox');
  const field = el('textarea');
  field.id = 'textAnswer'; field.rows = 2; field.maxLength = 1000; field.placeholder = 'Type here…';
  const actions = el('div', 'c2i-actions');
  const ok = el('button', 'opt go', 'Submit');
  ok.addEventListener('click', () => {
    const v = field.value.trim();
    if(required && !v){ say('Write something first, or pick an option above.', 2600); field.focus(); return; }
    done(v);
  });
  const cancel = el('button', 'opt alt', 'Cancel');
  cancel.addEventListener('click', () => { wrap.remove(); anchor.classList.remove('active'); own.hidden = false; });
  actions.append(ok, cancel);
  wrap.append(el('div', 'c2i-note', note), field, actions);
  own.after(wrap);
  field.focus({preventScroll:true});
  wrap.scrollIntoView({block:'nearest', behavior:'smooth'});
}

const NOTED = ['Noted.', 'Interesting.', 'Got it.', 'Good thinking.', 'Hmm, nice.'];

function answerPick(card, value, tag){
  locked = true;
  stopClock();
  const stage = STAGE_BY_TAG[tag] || null;
  // the wording too, since it depends on the branch; new column names so rows from
  // before, where "Question N" held the answer, don't get mixed up with these
  pick.fields.push([`Question ${pick.i + 1} asked`, pick.qs[pick.i][0]]);
  pick.fields.push([`Question ${pick.i + 1} answer`, stage ? `${value} (${stage})` : value]);
  if(stage) pick.counts[stage] = (pick.counts[stage] || 0) + 1;

  const box = $('opts');
  box.classList.add('locked');
  [...box.querySelectorAll('.opt')].forEach(o => o.classList.add(o === card ? 'picked' : 'dim'));
  const img = $('hostimg');
  img.classList.remove('cheer', 'shrug'); void img.offsetWidth; img.classList.add('cheer');
  say(NOTED[Math.floor(Math.random() * NOTED.length)], 1400);

  advanceTimer = setTimeout(() => {
    pick.i++;
    if(pick.i < pick.qs.length) return renderPick();
    pickFinish();
  }, 650);
}

/* Ends a gallery round, when the last question is answered or the clock runs out.
   Most frequent stage; walking up from Citizen and only moving on a strictly higher
   count means an even split stays on the lower stage. Nothing scored → Citizen. */
function pickFinish(){
  const order = ['Citizen', 'Seeker', 'Solver', 'Innovator'];
  c2iReached = order.reduce((a, b) => (pick.counts[b] || 0) > (pick.counts[a] || 0) ? b : a);
  c2iFields = pick.fields;
  pick = null;
  finish();
}

function isTextQuestion(item){ return item && item.type === 'text'; }

/* No wrong answers and no minimum length — any typed response is accepted,
   it just can't be empty. */
function evaluateC2IAnswer(item, value){
  const text = (value || '').trim();
  if(!text){ return { pass:false, message:'Please type an answer before submitting.' }; }
  return { pass:true, message:'Thanks for sharing your thinking.' };
}

/* Ends the cascade round right away, the way answering any stage should. */
function endC2IRound(){ clearTimers(); finish(); }

function submitTextAnswer(item){
  const answerBox = $('textAnswer');
  if(!answerBox) return;

  const result = evaluateC2IAnswer(item, answerBox.value);
  if(!result.pass){
    say(result.message, 2600);
    return;
  }

  stopClock();
  c2iReached = item.stage;
  noteAnswer(item, answerBox.value.trim());
  right++;
  score += POINTS_RIGHT;

  $('verdict').textContent = 'Response recorded.';
  $('verdict').className = 'verdict good';
  $('feedback').classList.add('on');
  $('explain').textContent = item.stage === 'Solver'
    ? 'Lower frequency means the water is being driven more strongly over time, so the movement becomes easier to see and more energetic.'
    : 'Nice idea — ideas like this are exactly how a simple demonstration turns into a real application.';
  $('wonder').textContent = item.stage === 'Solver'
    ? 'What would happen if you kept lowering the frequency even further?'
    : 'Which part of your idea would be hardest to actually build?';

  $('nextBtn').style.visibility = 'visible';
  $('nextBtn').textContent = 'See your result';
  $('nextBtn').focus({preventScroll:true});
  clearTimeout(advanceTimer);
  clearInterval(tickTimer);
  advanceTimer = setTimeout(endC2IRound, AUTO_ADVANCE_SEC * 1000);
}

/* ================== SETTINGS ================== */
const PER_ROUND        = 10;
const POINTS_RIGHT     = 100;
const POINTS_WRONG     = -50;
const IDLE_RESET_SEC   = 180;  // kiosk returns to the start screen after this long with no activity
const AUTO_ADVANCE_SEC = 4;
/* Timer. TIMER_MODE: 'round' = one clock for the whole round,
   'question' = a fresh clock on every question, 'off' = no timer.
   The clock pauses while an explanation is on screen either way.
   The gallery quiz gives each question its own clock; the "visited yet?" step has none. */
const TIMER_MODE       = 'question';
const TIMER_SECONDS    = 45;
const KEY_PLAYERS = 'parsec_wf_quiz_players';
const KEY_MISSES  = 'parsec_wf_quiz_misses';
const KEY_DAY     = 'parsec_wf_quiz_day';
const KEY_BULB_PLAYED = 'parsec_wf_bulb_players';   // everyone who played the bulbs today, in order
const KEY_BIN_PLAYED  = 'parsec_wf_binary_players'; // the same for the binary clock
const KEY_BIN_DONE    = 'parsec_wf_binary_finishers';

/* ================== STORAGE ================== */
function today(){ return new Date().toDateString(); }
function store(key, fallback){
  try{
    if(localStorage.getItem(KEY_DAY) !== today()){
      localStorage.setItem(KEY_DAY, today());
      localStorage.removeItem(KEY_PLAYERS);
      localStorage.removeItem(KEY_BULB_PLAYED);
      localStorage.removeItem(KEY_BIN_PLAYED);
      localStorage.removeItem(KEY_BIN_DONE);
      localStorage.removeItem(KEY_MISSES);
      localStorage.removeItem(KEY_GAME);
      localStorage.removeItem(KEY_BULB);
      localStorage.removeItem(KEY_BULB_LB);
      localStorage.removeItem(KEY_BULB_WIN_LB);
      localStorage.removeItem(KEY_BULB_TRIES);
      localStorage.removeItem(KEY_PUZ_RUN_LB);
      localStorage.removeItem(KEY_BULB_DONE);
      localStorage.removeItem(KEY_PUZ_DONE);
      localStorage.removeItem(KEY_PUZ);
      localStorage.removeItem(KEY_PUZ_LB);
      localStorage.removeItem(KEY_WIND);
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  }catch(e){ return fallback; }
}
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

function startRound(zid){
  clearTimers();
  zoneId = zid;
  c2iReached = null;
  c2iAnswers = {};
  c2iFields = null;

  if(C2I_BANK[zid]) return startPickRound(zid);

  if(C2I_ROUNDS[zid]){
    round = C2I_ROUNDS[zid].map(q => ({...q}));
    idx = 0; score = 0; right = 0; wrong = 0;
    const z = ZONES.find(z => z.id === zid);
    $('zoneName').textContent = z ? z.name : 'Across the floor';
    setHost(zid || (ZONES[Math.floor(Math.random()*ZONES.length)].id));
    show('quiz');
    renderQuestion();
    return;
  }

  const pool = zid ? QUESTIONS.filter(q => q.zone === zid) : QUESTIONS;
  round = shuffle(pool).slice(0, Math.min(PER_ROUND, pool.length));
  idx=0; score=0; right=0; wrong=0;
  const z = ZONES.find(z => z.id === zid);
  $('zoneName').textContent = z ? z.name : 'Across the floor';
  setHost(zid || (ZONES[Math.floor(Math.random()*ZONES.length)].id));
  show('quiz');
  if(TIMER_MODE === 'round') startClock();
  renderQuestion();
}

function renderQuestion(){
  clearTimers(); locked = false;
  const item = round[idx];
  $('count').textContent = `Question ${idx+1} of ${round.length}`;
  $('fill').style.width = (idx / round.length * 100) + '%';
  $('question').textContent = item.q;
  $('feedback').classList.remove('on');
  $('nextBtn').style.visibility = 'hidden';
  const box = $('opts');
  box.className = 'opts'; box.innerHTML = '';

  if(isTextQuestion(item)){
    const notice = document.createElement('div');
    notice.className = 'c2i-note';
    notice.textContent = 'Type your response in the box below.';
    box.appendChild(notice);

    const field = document.createElement('textarea');
    field.id = 'textAnswer';
    field.placeholder = 'Type your answer here...';
    field.rows = 5;
    field.value = '';
    box.appendChild(field);

    const actions = document.createElement('div');
    actions.className = 'c2i-actions';

    const submit = document.createElement('button');
    submit.className = 'opt';
    submit.textContent = 'Submit';
    submit.addEventListener('click', () => submitTextAnswer(item));
    actions.appendChild(submit);

    if(item.allowSkip){
      const skip = document.createElement('button');
      skip.className = 'opt alt';
      skip.textContent = 'Skip';
      skip.addEventListener('click', () => { noteAnswer(item, 'Skipped'); next(); });
      actions.appendChild(skip);
    }

    box.appendChild(actions);
    $('verdict').textContent = '';
    $('verdict').className = 'verdict';
    $('explain').textContent = '';
    $('wonder').textContent = '';
  }else{
    item.options.forEach((text,i) => {
      const b = document.createElement('button');
      b.className = 'opt'; b.textContent = text;
      b.addEventListener('click', () => answer(i));
      box.appendChild(b);
    });

    if(item.allowSkip){
      const skip = document.createElement('button');
      skip.className = 'opt alt full';
      skip.textContent = 'Skip';
      skip.addEventListener('click', () => { noteAnswer(item, 'Skipped'); next(); });
      box.appendChild(skip);
    }
  }

  if(TIMER_MODE === 'question') startClock();
  else if(TIMER_MODE === 'round') runClock();   // resume after the explanation pause
}

/* ---------- countdown clock ---------- */
let timeLeft = 0, clockInt = null;

function paintClock(){
  const c = $('clock');
  $('clockNum').textContent = Math.max(0, timeLeft);
  c.classList.toggle('warn', timeLeft <= 20 && timeLeft > 10);
  c.classList.toggle('crit', timeLeft <= 10);
}
function startClock(){
  if(TIMER_MODE === 'off'){ $('clock').classList.add('hide'); return; }
  $('clock').classList.remove('hide');
  timeLeft = TIMER_SECONDS;
  paintClock();
  runClock();
}
function runClock(){
  if(TIMER_MODE === 'off') return;
  clearInterval(clockInt);
  clockInt = setInterval(() => {
    timeLeft--;
    paintClock();
    if(timeLeft <= 0) timeUp();
  }, 1000);
}
function stopClock(){ clearInterval(clockInt); clockInt = null; }

function timeUp(){
  stopClock();
  if(pick && TIMER_MODE === 'question'){
    // gallery quiz: a question left unanswered moves on, counted as no answer
    if(locked) return;
    say("Time's up!", 1800);
    return answerPick(null, 'No answer (time up)', 0);
  }
  if(TIMER_MODE === 'question'){
    if(locked) return;
    const item = round[idx];
    if(item.allowSkip) next();              // skippable: time's up just moves the cascade down
    else if(isTextQuestion(item)) next();    // shouldn't occur today (Citizen is the only non-skip stage, and it's MCQ), but don't try to auto-submit an empty text answer
    else answer(-1);                        // non-skippable MCQ (Citizen): no choice made counts as wrong, ends the round
  }else{
    locked = true;
    $('opts').classList.add('locked');
    say("Time's up!", 4000);
    finish();
  }
}

function answer(choice){
  if(locked) return;
  const item = round[idx];
  if(isTextQuestion(item)){
    return submitTextAnswer(item);
  }

  locked = true;
  stopClock();
  $('opts').classList.add('locked');

  if(item.stage && item.answer !== undefined){
    // Cascade MCQ with a right answer: right lands on item.rightStage and ends the
    // round; wrong shows what's going on, then drops to the next stage down.
    const isRight = choice === item.answer;
    noteAnswer(item, `${item.options[choice] || 'No answer'} (${isRight ? 'right' : 'wrong'})`);
    [...$('opts').children].forEach((b,i) => {
      if(i === item.answer) b.classList.add('correct');
      else if(i === choice) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    react(isRight);

    $('verdict').textContent = isRight ? 'Right — and here is why.' : 'Not quite. Here is what is going on.';
    $('verdict').className = 'verdict ' + (isRight ? 'good' : 'bad');
    $('explain').textContent = item.explain;
    $('wonder').textContent = item.wonder;
    $('feedback').classList.add('on');

    const btn = $('nextBtn');
    btn.style.visibility = 'visible';
    btn.focus({preventScroll:true});
    if(isRight){
      c2iReached = item.rightStage || item.stage;
      right++;
      score += POINTS_RIGHT;
      btn.textContent = 'See your result';
      advanceTimer = setTimeout(endC2IRound, AUTO_ADVANCE_SEC*1000);
    }else{
      btn.textContent = 'Next question';
      advanceTimer = setTimeout(next, AUTO_ADVANCE_SEC*1000);
    }
    return;
  }

  if(item.stage){
    // Citizen/Seeker in the cymatics cascade: there is no wrong answer here,
    // every perspective is valid \u2014 just acknowledge it and explain what's really going on.
    [...$('opts').children].forEach((b,i) => b.classList.add(i === choice ? 'correct' : 'dim'));
    c2iReached = item.stage;
    noteAnswer(item, item.options[choice] || 'No answer');
    right++;
    score += POINTS_RIGHT;
    react(true);

    $('verdict').textContent = 'Thanks for sharing your thinking \u2014 here is what is actually going on.';
    $('verdict').className = 'verdict good';
    $('explain').textContent = item.explain;
    $('wonder').textContent = item.wonder;
    $('feedback').classList.add('on');

    const btn = $('nextBtn');
    btn.style.visibility = 'visible';
    btn.textContent = 'See your result';
    btn.focus({preventScroll:true});
    advanceTimer = setTimeout(endC2IRound, AUTO_ADVANCE_SEC*1000);
    return;
  }

  const isRight = choice === item.answer;
  [...$('opts').children].forEach((b,i) => {
    if(i === item.answer) b.classList.add('correct');
    else if(i === choice) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  const delta = isRight ? POINTS_RIGHT : POINTS_WRONG;
  score += delta;
  isRight ? right++ : wrong++;

  if(!isRight){
    const m = store(KEY_MISSES, {});
    m[item.q] = (m[item.q] || 0) + 1;
    save(KEY_MISSES, m);
  }

  react(isRight);

  $('verdict').textContent = isRight ? 'Right \u2014 and here is why.' : 'Not this time. Here is what is going on.';
  $('verdict').className = 'verdict ' + (isRight ? 'good' : 'bad');
  $('explain').textContent = item.explain;
  $('wonder').textContent = item.wonder;
  $('feedback').classList.add('on');

  const label = (idx === round.length-1) ? 'See your result' : 'Next question';
  const btn = $('nextBtn');
  btn.style.visibility = 'visible';
  btn.focus({preventScroll:true});
  let left = AUTO_ADVANCE_SEC;
  btn.textContent = `${label} (${left})`;
  tickTimer = setInterval(() => { left--; btn.textContent = left>0 ? `${label} (${left})` : label; }, 1000);
  advanceTimer = setTimeout(next, AUTO_ADVANCE_SEC*1000);
}

function next(){ clearTimers(); idx++; if(idx >= round.length) finish(); else renderQuestion(); }

/* What to tell the player once they've landed on a stage. The stage name itself
   isn't shown — just a headline and a closing line; the stage still goes to the dashboard. */
const C2I_END_LINES = {
  Innovator: { head:"You saw past what was built. Now build it.",   line:"An idea nobody makes is just a thought." },
  Solver:    { head:"You fix what is in front of you. The next step is spotting the problem nobody has reported yet.", line:"" },
  Seeker:    { head:"You ask good questions. Now break something.", line:"Understanding starts where the trying begins." },
  Citizen:   { head:"You came to see. Next time, come to ask.",     line:"The best questions in this building were asked by people who did not know the answer." }
};

function finish(){
  clearTimers();
  stopClock();
  const z = ZONES.find(z => z.id === zoneId);

  if(c2iReached){
    const end = C2I_END_LINES[c2iReached] || { head:'', line:'' };
    $('endWho').textContent = player ? `${player},` : '';
    $('endWho').className = 'sub endname';
    $('final').textContent = end.head;
    $('final').className = 'final msg' + (end.head.length > 60 ? ' long' : '');   // long headlines: smaller, wider, ~2 lines
    $('endVerdict').textContent = end.line;
    $('endTag').hidden = false;
    $('tally').innerHTML = '';
    say('Nice thinking!', 5000);
  }else{
    $('final').className = 'final';
    $('endWho').className = 'sub';
    $('endTag').hidden = true;
    const attempted = right + wrong;
    const max = (attempted || round.length) * POINTS_RIGHT;
    const pct = max ? score / max : 0;
    $('endWho').textContent = player ? `${player}, you brought back` : 'You brought back';
    $('final').textContent = score;
    $('final').classList.toggle('neg', score < 0);
    $('endVerdict').textContent = lineFor(pct);
    $('tally').innerHTML =
      `<span>${right} right &middot; +${right*POINTS_RIGHT}</span>` +
      `<span>${wrong} wrong &middot; &minus;${wrong*Math.abs(POINTS_WRONG)}</span>` +
      (attempted < round.length ? `<span>${round.length-attempted} unanswered</span>` : '');
    say(score >= 0 ? 'Nice round!' : 'Come back for another go.', 5000);
  }

  const players = store(KEY_PLAYERS, []);
  players.push({
    name: player || 'Guest',
    score: score,
    right: right,
    wrong: wrong,
    zone: z ? z.name : 'Mixed',
    at: new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'}),
    c2iStage: c2iReached
  });
  save(KEY_PLAYERS, players);

  // Also send the result to the server for the daily email report. Best-effort:
  // outside Apps Script (or offline) this just does nothing.
  try{
    if(window.google && google.script && google.script.run){
      google.script.run.withFailureHandler(() => {})
        .logResult({ name: player || 'Guest', zone: z ? z.name : 'Mixed', stage: c2iReached || '',
          score: score, right: right, wrong: wrong,
          fields: c2iFields || ['Innovator','Solver','Seeker','Citizen'].map(s => [`${s} answer`, c2iAnswers[s] || '']) });
    }
  }catch(e){}

  show('end');
}

/* ---------- scroll reveal ---------- */
let revealObserver = null;
function armReveals(){
  const targets = [
    ...document.querySelectorAll('#heroSlot > *'),
    ...document.querySelectorAll('#stats > *'),
    ...document.querySelectorAll('#dash .sectitle'),
    ...document.querySelectorAll('#gcards > *'),
    ...document.querySelectorAll('#c2iStats > *'),
    ...document.querySelectorAll('#board > *'),
    ...document.querySelectorAll('#scPanel > *')
  ];
  if(!revealObserver){
    revealObserver = new IntersectionObserver(entries => {
      entries.forEach(en => en.target.classList.toggle('in', en.isIntersecting));
    }, {root: $('dash'), threshold: 0.15, rootMargin: '0px 0px -6% 0px'});
  }else{
    revealObserver.disconnect();
  }
  targets.forEach((el, i) => {
    el.classList.add('rv');
    el.style.transitionDelay = Math.min(i % 6, 5) * 55 + 'ms';
    revealObserver.observe(el);
  });
}

    `<div class="stat"><b>${totalQs}</b><span>questions answered</span></div>` +
    `<div class="stat"><b>${accuracy}%</b><span>answered correctly</span></div>` +
    `<div class="stat"><b>${best}</b><span>highest score</span></div>` +
    `<div class="stat"><b>${busiest ? busiest[0] : '\u2014'}</b><span>busiest gallery</span></div>`;

  /* gallery cards — only the galleries currently offered in the picker */
  $('gcards').innerHTML = ZONES.filter(z => ACTIVE_ZONES.includes(z.id)).map(z => {

      <div class="art gart">${ART[z.id] || ''}</div>

      </div></div>`;
  }).join('');

  /* Citizen / Seeker / Solver / Innovator — how far each visitor got in the cascade */
  const c2iCounts = { Citizen:0, Seeker:0, Solver:0, Innovator:0 };
  all.forEach(p => { if(c2iCounts.hasOwnProperty(p.c2iStage)) c2iCounts[p.c2iStage]++; });
  $('c2iStats').innerHTML = ['Citizen','Seeker','Solver','Innovator'].map(s =>
    `<div class="stat"><b>${c2iCounts[s]}</b><span>${s}</span></div>`
  ).join('');
  peekSet(false);   // hidden again every time the board opens

  /* full list */
  board.innerHTML = '';
  if(!players.length){
    board.innerHTML = '<p class="empty">The board fills up as visitors play.</p>';
  }else{
    players.slice(0, 15).forEach((p, i) => {
