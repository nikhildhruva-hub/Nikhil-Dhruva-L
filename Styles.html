<style>

:root{
  /* Param royal + fluorescents, as in the C2I diagnostic; dark for the kiosk. */
  --deep:#12145A; --deep-2:#191C6E; --panel:#22268A; --panel-2:#2A2E9C; --line:#3B40B4;
  --pale:#F5F6FF; --mute:#B9BCEB; --accent:#D9FF35; --on-accent:#0B1020; --coral:#FF8A8A;
  --sky:#3FEDE0; --seeker:#3FEDE0; --solver:#FF8C1A; --innov:#3FE827; --radius:20px;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  /* roles built on the palette, so each theme can set them once */
  --accent-ink:#D9FF35;                                   /* lime used as text */
  --glow-1:#2B2FA6; --glow-2:#1E2190;                      /* soft light in the page corners */
  --scrim:rgba(14,16,70,.92);                              /* panels laid over a game */
  --bubble:#F5F6FF; --on-bubble:#0B1020;                   /* speech bubbles, the Next button */
  --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.13);   /* faint fills on panels */
  color-scheme:dark;
}
/* light mode: the same roles on white and soft periwinkle. Status colours deepen
   so they still read as text; lime stays as a fill and becomes olive as text. */
:root[data-theme="light"]{
  --deep:#EEF1FF; --deep-2:#E2E7FF; --panel:#FFFFFF; --panel-2:#F3F5FF; --line:#C3C9F0;
  --pale:#14164F; --mute:#50558F; --coral:#D23B3B;
  --sky:#0B9A92; --seeker:#0B9A92; --solver:#D46A00; --innov:#23961A;
  --accent-ink:#4E7800;
  --glow-1:#D6DCFF; --glow-2:#D8F4F1;
  --scrim:rgba(238,241,255,.95);
  --bubble:#14164F; --on-bubble:#F5F6FF;
  --glass:rgba(20,22,79,.04); --glass-2:rgba(20,22,79,.08);
  color-scheme:light;
}
h1,h2.title,.hero-name,.final,.q,.stat b,.gbody b,.who{
  font-family:var(--display);letter-spacing:-.01em;
}
h1,.hero-name,.final{font-weight:800}

/* ---- floating Zinions ---- */
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--tilt,0deg))}50%{transform:translateY(-14px) rotate(var(--tilt,0deg))}}
@keyframes cheer{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-26px) scale(1.09)}60%{transform:translateY(0) scale(1)}80%{transform:translateY(-9px) scale(1.03)}100%{transform:translateY(0) scale(1)}}
@keyframes shrug{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-7px) rotate(-4deg)}45%{transform:translateX(7px) rotate(4deg)}70%{transform:translateX(-4px) rotate(-2deg)}}

.mascot{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 22px rgba(0,0,0,.45));animation:bob 5s ease-in-out infinite}
.mascot.cheer{animation:cheer .85s ease-out}
.mascot.shrug{animation:shrug .6s ease-out}

/* drifting crowd behind the start screen */
.drift{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden;transition:opacity .5s}
.drift img{position:absolute;opacity:.16;animation:bob 7s ease-in-out infinite;filter:none}
.drift img:nth-child(1){width:15vmin;top:6%;left:4%;--tilt:-6deg;animation-duration:6.5s}
.drift img:nth-child(2){width:12vmin;top:62%;left:8%;--tilt:5deg;animation-duration:8s;animation-delay:-2s}
.drift img:nth-child(3){width:14vmin;top:12%;right:5%;--tilt:7deg;animation-duration:7.2s;animation-delay:-1s}
.drift img:nth-child(4){width:16vmin;bottom:4%;right:6%;--tilt:-4deg;animation-duration:9s;animation-delay:-3s}
.drift img:nth-child(5){width:10vmin;bottom:3%;left:24%;   /* low and to the side, clear of the game cards */--tilt:3deg;animation-duration:6s;animation-delay:-4s}

/* the host who stands with you through a round */
.hostwrap{position:fixed;right:clamp(6px,1.6vw,26px);bottom:clamp(6px,1.6vh,24px);width:clamp(110px,16vw,230px);z-index:5;pointer-events:none}
.hostwrap.hide{display:none}
.hostsay{
  background:var(--bubble);color:var(--on-bubble);font-family:var(--display);font-weight:700;
  font-size:clamp(11px,1.5vw,16px);border-radius:12px;padding:6px 10px;text-align:center;
  margin-bottom:9px;opacity:0;transition:opacity .25s;line-height:1.25;
}
.hostsay.on{opacity:1}
@media (max-width:760px){.hostwrap{width:96px;right:4px;bottom:4px;opacity:.85}}

@media (prefers-reduced-motion:reduce){.mascot,.drift img{animation:none!important}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(1100px 650px at 85% -10%,var(--glow-1) 0%,transparent 60%),
             radial-gradient(900px 600px at -10% 110%,var(--glow-2) 0%,transparent 55%),var(--deep);
  transition:background-color .4s,color .4s;
  color:var(--pale);
  font-family:'Space Grotesk','Trebuchet MS',system-ui,sans-serif;
  overflow:hidden;display:flex;align-items:center;justify-content:center;
  padding:clamp(12px,2.6vw,36px);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
input{font-family:inherit}
.stage{width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column}
.screen{display:none}
.screen.on{display:flex;flex-direction:column;gap:clamp(12px,2.2vh,28px)}
[hidden]{display:none!important}
.scrollable{overflow-y:auto;-webkit-overflow-scrolling:touch}
/* while the name is being typed, nudge the home page up a little
   so the on-screen keyboard has more room */
body.typing #start{transform:translateY(-50px)}

.orbit{
  width:clamp(60px,9vh,110px);height:clamp(60px,9vh,110px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#6A6EE6,#191C6E 70%);
  box-shadow:0 0 0 10px rgba(67,68,161,.25),0 0 60px rgba(217,255,53,.16);
  position:relative;margin:0 auto;
}
.orbit::after{content:"";position:absolute;inset:-26% -6%;border:2px solid var(--line);border-radius:50%;transform:rotate(-18deg)}
h1{font-size:clamp(30px,6vw,64px);font-weight:700;line-height:.98;letter-spacing:-.03em;text-align:center}
h2.title{font-size:clamp(26px,4.4vw,44px);font-weight:700;letter-spacing:-.02em}
.sub{text-align:center;color:var(--mute);font-size:clamp(14px,1.9vw,20px);max-width:48ch;margin:0 auto;line-height:1.5}
.rules{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.rule{border:2px solid var(--line);border-radius:var(--radius);padding:10px 18px;display:flex;align-items:baseline;gap:8px}
.rule b{font-size:clamp(18px,2.8vw,26px);font-weight:700}
.rule.good b{color:var(--accent-ink)} .rule.bad b{color:var(--coral)}
.rule.observe b{color:var(--seeker)} .rule.wonder b{color:var(--solver)} .rule.share b{color:var(--innov)}
.rule.wonder{font-style:normal;max-width:none;font-size:inherit;line-height:inherit}   /* not the italic .wonder feedback text */
.rule span{color:var(--mute);font-size:clamp(12px,1.5vw,15px)}
.big-btn{background:var(--accent);color:var(--on-accent);font-weight:700;font-size:clamp(17px,2.2vw,23px);padding:18px 40px;border-radius:999px;align-self:center;transition:transform .12s ease}
.big-btn:active{transform:scale(.96)}
.ghost{border:2px solid var(--line);color:var(--mute);font-weight:600;font-size:clamp(14px,1.7vw,17px);padding:12px 26px;border-radius:999px;align-self:center}

/* name entry */
.namerow{display:flex;gap:10px;max-width:520px;width:100%;margin:0 auto}
#nameInput{
  flex:1;background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);
  color:var(--pale);font-size:clamp(17px,2.2vw,22px);padding:16px 20px;
}
#nameInput::placeholder{color:var(--mute)}

/* home: the welcome screen. The whole screen is one big "touch to play". */
#home{align-items:center;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.homekicker{color:var(--accent-ink);font-weight:700;letter-spacing:.18em;text-transform:uppercase;font-size:clamp(11px,1.4vw,14px);animation:homefade .8s ease both}
/* the title: each letter has its own colour along a white–lime–teal sweep, and a wave
   rolls along it, lifting and lighting each letter in turn */
.hometitle{font-size:clamp(38px,7.6vw,112px);animation:homefade .8s .1s ease both}
.hometitle span{display:inline-block;animation:wave 4.5s ease-in-out infinite;animation-delay:var(--d)}
@keyframes wave{0%,70%,100%{translate:0 0;text-shadow:none}80%{translate:0 -12px;text-shadow:0 0 22px currentColor}90%{translate:0 2px}}
/* "Spark your …" cycles through the three Cs, and the matching card lights up */
.homespark{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.2vw,36px);color:var(--pale);animation:homefade .8s .25s ease both}
.homeword{display:inline-block;min-width:6.2em;text-align:left;color:var(--c,var(--accent));text-shadow:0 0 24px var(--c,var(--accent));transition:opacity .3s,transform .3s}
.homeword.out{opacity:0;transform:translateY(-12px)}
.homec{display:flex;justify-content:center;align-items:center}
/* the links between the three Cs: dashes flow from one card's colour to the next, and
   a spark runs along a link as the next card lights up */
.ccl{--a:var(--solver);--b:var(--seeker);position:relative;flex:none;width:clamp(26px,7vw,130px);height:5px;filter:drop-shadow(0 0 4px var(--b))}
.ccl + .cc + .ccl{--a:var(--seeker);--b:var(--innov)}
.ccl::before{content:"";position:absolute;inset:0;border-radius:2px;opacity:.75;
  background:linear-gradient(90deg,var(--a),var(--b));
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 12px);mask:repeating-linear-gradient(90deg,#000 0 7px,transparent 7px 12px);
  -webkit-mask-size:24px 100%;mask-size:24px 100%;animation:flow .9s linear infinite}
@keyframes flow{to{-webkit-mask-position:24px 0;mask-position:24px 0}}
.ccl i{position:absolute;top:50%;left:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
  background:#fff;box-shadow:0 0 10px #fff,0 0 22px var(--b);opacity:0}
.ccl.go i{animation:zap .35s ease-in forwards}
.ccl.back i{animation:zapback .3s ease-in forwards;box-shadow:0 0 10px #fff,0 0 22px var(--a)}
@keyframes zap{from{left:0;opacity:1}to{left:100%;opacity:.2}}
@keyframes zapback{from{left:100%;opacity:1}to{left:0;opacity:.2}}
@media (max-width:640px){.homec{flex-wrap:wrap;gap:10px}.ccl{display:none}}
.cc{
  --c:var(--accent);display:flex;align-items:center;gap:12px;text-align:left;
  background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:12px 26px 12px 12px;
  transition:border-color .4s,box-shadow .4s,scale .4s;
}
.cc{animation:popin .7s cubic-bezier(.3,1.6,.5,1) both,float 4s ease-in-out infinite}
.cc:nth-of-type(1){--c:var(--solver);animation-delay:.45s,0s}
.cc:nth-of-type(2){--c:var(--seeker);animation-delay:.6s,-1.3s}
.cc:nth-of-type(3){--c:var(--innov);animation-delay:.75s,-2.6s}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}
.cc.on .ccicon svg{animation:wiggle .9s ease-in-out}
@keyframes wiggle{20%{rotate:-14deg}40%{rotate:12deg}60%{rotate:-8deg}80%{rotate:4deg}}
.ccicon{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:var(--glass);transition:background .4s,color .4s}
.cctext b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(16px,2vw,24px);line-height:1.1;color:var(--pale)}
.cctext i{font-style:normal;color:var(--mute);font-size:clamp(12px,1.4vw,16px)}
.cc.on{border-color:var(--c);box-shadow:0 0 28px -4px var(--c);scale:1.06}
.cc.on .ccicon{background:var(--c);color:var(--on-accent)}
.homequote{max-width:70ch;color:var(--mute);font-style:italic;font-size:clamp(14px,1.8vw,19px);line-height:1.45;animation:homefade .8s 1.1s ease both}
.homequote b{color:var(--accent-ink);font-style:normal;font-weight:700}
/* the helix: two glowing strands of beads crossing over, joined by rungs */
.dna{--amp:clamp(28px,6vh,58px);display:flex;justify-content:space-between;align-items:center;
  width:min(1000px,86vw);height:calc(var(--amp) * 2 + 24px);margin:clamp(6px,1.6vh,18px) 0;animation:homefade .8s .6s ease both}
.bp{position:relative;width:12px;height:100%}
.bp i{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
  animation:dnaY 1.8s ease-in-out infinite alternate,dnaZ 3.6s linear infinite;animation-delay:var(--d),var(--d)}
.bp i.a{background:var(--sky);box-shadow:0 0 12px var(--sky)}
.bp i.b{background:var(--b,var(--accent));box-shadow:0 0 12px var(--b,var(--accent));animation-delay:calc(var(--d) - 1.8s),calc(var(--d) - 1.8s)}
.bp s{position:absolute;left:50%;top:50%;width:2px;height:calc(var(--amp) * 2);margin:calc(var(--amp) * -1) 0 0 -1px;
  background:linear-gradient(var(--sky),rgba(245,246,255,.5),var(--b,var(--accent)));opacity:.45;
  animation:rung 1.8s ease-in-out infinite;animation-delay:var(--d)}
@keyframes dnaY{from{translate:0 calc(var(--amp) * -1)}to{translate:0 var(--amp)}}
@keyframes dnaZ{0%,100%{scale:1;opacity:.85}25%{scale:1.45;opacity:1}75%{scale:.5;opacity:.4}}
@keyframes rung{0%,100%{scale:1 1}50%{scale:1 0}}

/* the light behind: three slow-drifting glows, and sparks rising and twinkling */
.homefx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#home > :not(.homefx){position:relative;z-index:1}   /* the words always sit in front of the light behind */
.blob{position:absolute;width:60vmax;height:60vmax;border-radius:50%;opacity:.32;animation:drift 22s ease-in-out infinite alternate}
.blob:nth-child(1){left:-20vmax;top:-25vmax;background:radial-gradient(circle,rgba(63,237,224,.55),transparent 62%)}
.blob:nth-child(2){right:-22vmax;top:10vh;background:radial-gradient(circle,rgba(217,255,53,.4),transparent 62%);animation-duration:26s;animation-delay:-8s}
.blob:nth-child(3){left:20vw;bottom:-35vmax;background:radial-gradient(circle,rgba(120,90,255,.5),transparent 62%);animation-duration:30s;animation-delay:-14s}
@keyframes drift{0%{translate:0 0;scale:1}50%{translate:8vw 6vh;scale:1.15}100%{translate:-6vw 10vh;scale:.95}}
.sparks i{position:absolute;bottom:-12px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);opacity:0;
  animation:rise var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes rise{0%{translate:0 0;opacity:0}10%{opacity:.9}50%{opacity:.35}70%{opacity:.85}100%{translate:var(--x) -105vh;opacity:0}}

/* light mode on the welcome screen: the lime strand and links deepen so they show on white */
:root[data-theme="light"] .hometitle span{animation-name:wavelight}
@keyframes wavelight{0%,70%,100%{translate:0 0;text-shadow:none}80%{translate:0 -12px;text-shadow:0 0 18px rgba(200,240,40,.9)}90%{translate:0 2px}}
:root[data-theme="light"] .bp i.b{box-shadow:0 0 10px var(--b,#94C700)}
:root[data-theme="light"] .bp s{opacity:.35}
:root[data-theme="light"] .blob{opacity:.5}
:root[data-theme="light"] .hometap{box-shadow:0 8px 30px rgba(120,150,0,.35)}
:root[data-theme="light"] .cc{box-shadow:0 6px 18px rgba(20,22,79,.08)}
/* game cards: a soft edge so white cards don't melt into the page, a deeper lime ring */
:root[data-theme="light"] .mode{border-color:var(--line);box-shadow:0 10px 26px rgba(20,22,79,.10)}
:root[data-theme="light"] .mode.play{border-color:#94C700;box-shadow:0 10px 26px rgba(120,160,0,.22)}
:root[data-theme="light"] .mode img{filter:drop-shadow(0 8px 12px rgba(20,22,79,.22))}

/* the light/dark switch, in the bottom-left corner of every screen */
.themebtn{position:fixed;left:clamp(10px,1.6vw,22px);bottom:clamp(10px,1.6vh,22px);z-index:40;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center;background:var(--panel);color:var(--pale);border:2px solid var(--line);
  box-shadow:0 6px 18px rgba(0,0,0,.25);transition:background .3s,color .3s,border-color .3s,rotate .5s}
.themebtn:active{scale:.92}
.themebtn svg{width:22px;height:22px}
.themebtn .moon{display:none}
:root[data-theme="light"] .themebtn{rotate:180deg}
:root[data-theme="light"] .themebtn .sun{display:none}
:root[data-theme="light"] .themebtn .moon{display:block;rotate:180deg}

/* a glowing ripple where the screen is touched */
.taprip{position:fixed;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:3px solid var(--accent);
  box-shadow:0 0 24px var(--accent);pointer-events:none;z-index:50;animation:taprip .45s ease-out forwards}
@keyframes taprip{to{scale:9;opacity:0}}
.hometap{
  position:relative;display:inline-flex;align-items:center;gap:12px;margin-top:clamp(4px,1vh,12px);
  background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,32px);
  padding:clamp(14px,2vh,20px) clamp(32px,4vw,52px);border-radius:999px;box-shadow:0 0 40px rgba(217,255,53,.35);
  animation:homefade .8s .9s ease both,breathe 2.4s 1.7s ease-in-out infinite;
}
.hometap .ring{position:absolute;inset:0;border-radius:inherit;border:3px solid var(--accent);animation:ripple 2.4s ease-out infinite;pointer-events:none}
.hometap .ring + .ring{animation-delay:1.2s}
.hometap{overflow:visible}
.hometap::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%) no-repeat;
  background-size:250% 100%;animation:shine 3.2s 2s ease-in-out infinite}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-60% 0}}
.hometap svg{animation:tapfinger 1.2s ease-in-out infinite}
.homequote{margin-top:clamp(8px,2vh,22px)}
@keyframes homefade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popin{from{opacity:0;transform:translateY(50px) scale(.5)}to{opacity:1;transform:none}}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(1.15,1.45);opacity:0}}
@keyframes tapfinger{0%,100%{transform:translateY(0)}50%{transform:translateY(4px) rotate(-10deg)}}
@media (prefers-reduced-motion:reduce){
  .homekicker,.hometitle,.hometitle span,.homespark,.cc,.cc svg,.ccl::before,.ccl i,.dna,.bp i,.bp s,.blob,.sparks i,.hometap,.hometap .ring,.hometap svg,.hometap::after,.homequote{animation:none!important}
  .sparks{display:none}
}
@media (max-width:640px){.dna{width:92vw}}

/* name before a game: a card with the game's Zinion beside the name box */
.joinwrap{display:grid;grid-template-columns:minmax(0,680px);justify-content:center;width:100%}
.joincard{
  position:relative;overflow:hidden;
  background:radial-gradient(420px 260px at 0% 0%,rgba(217,255,53,.10),transparent 70%),
             linear-gradient(160deg,var(--panel-2),var(--panel) 55%,var(--deep-2));
  border:2px solid var(--line);border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.35);
  padding:clamp(24px,3.6vw,44px);padding-right:clamp(120px,18vw,230px);
  display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px);
}
.joinmascot{position:absolute;right:clamp(10px,1.8vw,26px);bottom:clamp(10px,2vh,24px);width:clamp(100px,15vw,190px);max-height:75%;object-fit:contain}
.joingame{
  align-self:flex-start;color:var(--accent-ink);background:rgba(217,255,53,.12);border:1px solid rgba(217,255,53,.35);
  border-radius:999px;padding:5px 14px;font-weight:700;font-size:clamp(12px,1.5vw,15px);letter-spacing:.02em;
}
.joincard h2.title{line-height:1.05}
.joincard .sub{text-align:left;margin:0;max-width:34ch}
.joinfield{
  display:flex;align-items:center;max-width:520px;margin-top:4px;
  background:var(--deep);border:2px solid var(--line);border-radius:999px;padding:6px;
  transition:border-color .2s,box-shadow .2s;animation:inputpulse 2.4s ease-in-out infinite;
}
.joinfield:focus-within{border-color:var(--accent);box-shadow:0 0 0 5px rgba(217,255,53,.18);animation:none}
#joinInput{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--pale);font-size:clamp(18px,2.3vw,24px);font-weight:600;padding:12px 18px}
#joinInput::placeholder{color:var(--mute);font-weight:500}
.joingo{
  flex:none;background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:800;
  font-size:clamp(17px,2.1vw,22px);padding:12px clamp(20px,2.6vw,30px);border-radius:999px;transition:transform .12s ease;
}
.joingo:active{transform:scale(.95)}
.joinhint{color:var(--mute);font-size:clamp(12px,1.4vw,14px)}
/* the name page sits in the middle with room kept below for the on-screen keyboard */
body.joining{padding-bottom:clamp(80px,22vh,260px)}
@media (prefers-reduced-motion:reduce){.joinfield{animation:none}}

@media (max-width:760px){
  .joinwrap{grid-template-columns:minmax(0,1fr)}
  .joincard{padding-right:clamp(24px,4vw,44px);padding-bottom:clamp(90px,24vw,130px)}
  .joinmascot{width:clamp(80px,22vw,110px)}
}

/* start screen: a soft pulse draws the eye to the name box */
#start #nameInput{animation:inputpulse 2.4s ease-in-out infinite}
#start #nameInput:focus{animation:none}
@keyframes inputpulse{0%,100%{box-shadow:0 0 0 0 rgba(217,255,53,0)}50%{box-shadow:0 0 0 6px rgba(217,255,53,.22)}}
@media (prefers-reduced-motion:reduce){#start #nameInput{animation:none}}
.tiny{text-align:center;color:var(--mute);font-size:clamp(11px,1.3vw,14px);max-width:52ch;margin:0 auto;line-height:1.5}

/* zones */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:clamp(8px,1.2vw,12px);overflow-y:auto;max-height:62vh;padding:2px}
.zone{background:var(--panel);border:2px solid transparent;border-radius:16px;padding:clamp(11px,1.6vh,18px) 16px clamp(11px,1.6vh,18px) 20px;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;transition:transform .12s ease,border-color .2s,background .2s}
.zone::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 3px 3px 0;background:var(--accent);opacity:.8}
.zone:hover{border-color:var(--line);background:var(--panel-2)}
.zone:active{transform:scale(.98)}
.zone b{font-size:clamp(16px,2vw,20px);font-weight:600;line-height:1.2}
.zone i{font-style:normal;color:var(--mute);font-size:clamp(11px,1.4vw,14px)}
.zone.all{background:transparent;border:2px solid var(--accent)}
.zone.all b{color:var(--accent-ink)}

/* quiz */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.count{color:var(--mute);font-size:clamp(12px,1.6vw,16px)}
.count em{font-style:normal;color:var(--pale);display:block;font-weight:600}
.scorebox{position:relative;text-align:right}
.scorelabel{color:var(--mute);font-size:clamp(11px,1.3vw,14px)}
.score{font-size:clamp(26px,4.2vw,46px);font-weight:700;line-height:1;transition:color .3s}
.score.neg{color:var(--coral)}
.pop{position:absolute;right:0;top:-6px;font-weight:700;font-size:clamp(18px,2.5vw,26px);opacity:0;pointer-events:none}
.pop.go{animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-46px)}}
.clock{text-align:center;line-height:1;transition:color .3s}
.clock.hide{visibility:hidden}
.clock b{font-family:var(--display);font-size:clamp(26px,4.2vw,44px);font-weight:800;display:block}
.clock span{color:var(--mute);font-size:clamp(10px,1.3vw,13px);display:block;margin-top:4px}
.clock.warn{color:var(--accent-ink)}
.clock.warn span{color:var(--accent-ink);opacity:.75}
.clock.crit{color:var(--coral)}
.clock.crit span{color:var(--coral);opacity:.75}
.clock.crit b{animation:pulse .9s ease-in-out infinite;transform-origin:100% 50%}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@media (prefers-reduced-motion:reduce){.clock.crit b{animation:none}}

.track{height:6px;background:var(--deep-2);border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--accent));width:0;transition:width .4s ease}
.stage-badge{display:inline-flex;align-items:center;justify-content:center;padding:6px 12px;border-radius:999px;font-size:clamp(11px,1.4vw,14px);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;border:1px solid var(--glass-2);background:var(--glass)}
.stage-badge.hidden{display:none !important}
.stage-badge.citizen{background:rgba(54,189,176,.18);color:#9AE9DF;border-color:rgba(54,189,176,.5)}
.stage-badge.seeker{background:rgba(125,164,255,.18);color:#B7C8FF;border-color:rgba(125,164,255,.5)}
.stage-badge.solver{background:rgba(255,184,77,.18);color:#FFD38A;border-color:rgba(255,184,77,.5)}
.stage-badge.transition{background:rgba(181,132,255,.18);color:#D8C0FF;border-color:rgba(181,132,255,.5)}
.stage-badge.innovator{background:rgba(131,214,126,.18);color:#C6F5AF;border-color:rgba(131,214,126,.5)}
.q{font-size:clamp(21px,3.5vw,38px);font-weight:600;line-height:1.2;letter-spacing:-.02em;max-width:none;width:100%}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.4vw,15px)}
.opt{background:var(--panel);border:2px solid transparent;border-radius:var(--radius);padding:clamp(14px,2.2vh,24px) clamp(15px,2.1vw,25px);text-align:left;font-size:clamp(15px,2vw,21px);font-weight:500;line-height:1.3;min-height:clamp(62px,9.5vh,96px);display:flex;align-items:center;transition:transform .12s ease,background .2s}
.opt:active{transform:scale(.985)}
.opt.correct{background:var(--accent);color:var(--on-accent);font-weight:700}
.opt.wrong{background:transparent;border-color:var(--coral);color:var(--coral)}
.opt.dim{opacity:.35}
.opts.locked .opt{pointer-events:none}
.opts .opt.full{grid-column:1/-1}
.c2i-note{color:var(--mute);font-size:clamp(13px,1.6vw,15px)}
.opts > .c2i-note,.opts > #textAnswer,.opts > .c2i-actions{grid-column:1/-1}
#textAnswer{
  width:100%;background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);
  color:var(--pale);font-family:inherit;font-size:clamp(14px,1.8vw,17px);padding:14px 16px;
  resize:vertical;margin-top:8px;
}
#textAnswer:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.c2i-actions{display:flex;gap:clamp(10px,1.6vw,16px);flex-wrap:wrap;margin-top:10px}
.c2i-actions .opt{flex:1 1 160px;justify-content:center;text-align:center}
.feedback{border-left:5px solid var(--line);padding:3px 0 3px 18px;display:none;flex-direction:column;gap:7px}
.feedback.on{display:flex}
.verdict{font-size:clamp(17px,2.3vw,23px);font-weight:700}
.verdict.good{color:var(--accent-ink)} .verdict.bad{color:var(--coral)}
.explain{font-size:clamp(13px,1.7vw,18px);line-height:1.5;max-width:66ch}
.wonder{font-size:clamp(13px,1.7vw,18px);line-height:1.5;color:var(--mute);max-width:66ch;font-style:italic}
.nextrow{display:flex;justify-content:flex-end}
.next{background:var(--bubble);color:var(--on-bubble);font-weight:700;font-size:clamp(15px,1.9vw,19px);padding:14px 30px;border-radius:999px}

/* end */
.final{font-size:clamp(50px,11vw,120px);font-weight:700;text-align:center;line-height:.9;letter-spacing:-.04em}
.final.neg{color:var(--coral)}
.final.word{font-size:clamp(32px,8vw,72px)}
.final.msg{font-size:clamp(28px,5.5vw,56px);line-height:1.1;letter-spacing:-.02em;max-width:18ch;margin:0 auto;text-wrap:balance}
.final.msg.long{font-size:clamp(20px,3.2vw,36px);max-width:48ch}
.sub.endname{font-family:var(--display);font-size:clamp(26px,4.4vw,48px);font-weight:800;color:var(--accent-ink);line-height:1.1}
.tally{display:flex;gap:26px;justify-content:center;color:var(--mute);font-size:clamp(13px,1.7vw,17px);flex-wrap:wrap}
.btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.footnote{text-align:center;color:var(--mute);font-size:clamp(11px,1.3vw,14px)}
.howto{display:flex;flex-direction:column;align-items:center;gap:8px}
.howto-title{font-family:var(--display);font-weight:700;font-size:clamp(14px,1.8vw,18px);color:var(--pale)}
.howto .rules{gap:8px}
.rule.step{padding:7px 14px;align-items:center}
.rule.step b{color:var(--accent-ink);font-size:clamp(16px,2.2vw,22px)}

/* dashboard */
.dashhead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.dashhead .title{margin:0}
.daystamp{color:var(--mute);font-size:clamp(12px,1.5vw,15px)}

/* leader hero */
.hero{
  display:grid;grid-template-columns:minmax(0,1fr) clamp(150px,26%,240px);
  gap:clamp(14px,2.4vw,30px);align-items:center;
  background:linear-gradient(115deg,var(--panel-2),var(--deep-2));
  border:2px solid var(--accent);border-radius:26px;padding:clamp(18px,2.8vw,32px);
}
.hero-eyebrow{color:var(--accent-ink);font-size:clamp(12px,1.5vw,15px);font-weight:600}
.hero-name{font-size:clamp(28px,5.4vw,54px);font-weight:700;letter-spacing:-.03em;line-height:1.02;margin:6px 0 10px;overflow-wrap:anywhere}
.hero-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero-score{font-size:clamp(24px,3.6vw,36px);font-weight:700;color:var(--accent-ink)}
.hero-art{opacity:.9}
.hero-art svg{width:100%;height:auto;display:block}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:clamp(8px,1.3vw,13px)}
.stat{background:var(--panel);border-radius:16px;padding:15px 18px}
.stats[hidden]{display:none}

/* eye that hides the curiosity levels until it is double-tapped */
.peek{display:flex;align-items:center;gap:14px}
.peek .sectitle{margin-top:0}
.peekeye{
  width:52px;height:52px;flex:0 0 auto;border-radius:50%;border:2px solid var(--line);
  background:var(--panel);display:grid;place-items:center;cursor:pointer;transition:border-color .2s,transform .12s;
  touch-action:manipulation;
}
.peekeye:active{transform:scale(.94)}
.peekeye:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.peekeye svg{width:26px;height:26px;fill:none;stroke:var(--mute);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.peekeye[aria-expanded="true"]{border-color:var(--accent)}
.peekeye[aria-expanded="true"] svg{stroke:var(--accent)}
.peekeye[aria-expanded="true"] .slash{display:none}
.peekhint{color:var(--mute);font-size:clamp(11px,1.3vw,13px)}
/* Argon's secret door and the stats screen behind it */
.lock{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,10,40,.72);padding:16px}
.lock[hidden]{display:none}
.lockbox{background:var(--deep-2);border:2px solid var(--line);border-radius:24px;padding:24px;width:min(100%,360px);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.lockbox b{font-family:var(--display);font-size:clamp(18px,2.4vw,22px)}
.lockimg{width:96px;height:auto}
#lockPw{width:100%;background:var(--panel);border:2px solid var(--line);border-radius:999px;color:var(--pale);font-size:17px;padding:12px 18px;text-align:center}
#lockPw:focus{outline:none;border-color:var(--accent)}
.lockerr{min-height:1.3em;color:var(--coral);font-size:14px}
.st-take{text-align:left;margin:0}
.st-split{display:flex;height:30px;border-radius:10px;overflow:hidden;gap:2px}
.st-split:empty{display:none}
#stats > *{flex-shrink:0}   /* the screen scrolls; without this the split bar squashes to nothing */
.st-seg{display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-weight:700;font-size:13px;min-width:0;overflow:hidden}
.st-key{display:flex;flex-wrap:wrap;gap:16px;color:var(--mute);font-size:13px}
.st-key span{display:flex;align-items:center;gap:6px}
.st-sw{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.st-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:clamp(8px,1.3vw,13px)}
.st-card{background:var(--panel);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.st-card > b{font-family:var(--display);font-size:clamp(15px,1.8vw,18px)}
.st-bydate{max-height:240px;overflow:auto}
.st-wide{grid-column:1/-1}
.qa-filters{display:flex;gap:12px;flex-wrap:wrap}
.lv-tabs{display:flex;gap:8px;flex-wrap:wrap}
.lv-tab{border:2px solid var(--line);border-radius:999px;padding:10px 22px;color:var(--mute);font-weight:700;font-size:clamp(14px,1.8vw,17px)}
.lv-tab.on{border-color:var(--accent);color:var(--accent-ink)}
.lv-why span{color:var(--pale);font-size:14px;line-height:1.5}
.lv-ans{align-items:baseline}
.lv-ans span:last-child{white-space:nowrap}
.qa-filters label{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:14px}
.qa-filters select{background:var(--panel);color:var(--pale);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;max-width:100%}
.qa-gal{color:var(--mute);font-size:12px;margin-top:-8px}
.qa-visits{display:flex;flex-direction:column;gap:10px;max-height:480px;overflow:auto}
.qa-visit{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.qa-visit:first-child{border-top:0;padding-top:0}
.qa-when{color:var(--accent-ink);font-size:13px;font-weight:700}
.qa-line{display:flex;flex-direction:column;font-size:13px;line-height:1.4}
.qa-line span{color:var(--mute)}
.qa-line b{color:var(--pale);font-weight:600}
.st-trend{color:var(--pale);font-size:14px;line-height:1.45}
.st-trend.up{color:var(--innov)}
.st-trend.down{color:var(--coral)}
.st-bydate table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.st-bydate th,.st-bydate td{padding:6px 3px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.st-bydate th:first-child,.st-bydate td:first-child{text-align:left;color:var(--pale)}
.st-bydate th{position:sticky;top:0;background:var(--panel);font-weight:700;color:var(--mute)}
.st-bydate td{color:var(--mute)}
.st-bydate td:last-child{color:var(--pale);font-weight:700}
.st-rows{display:flex;flex-direction:column;gap:10px}
.st-row{display:flex;flex-direction:column;gap:4px}
.st-lab{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute)}
.st-lab span:first-child{color:var(--pale)}
.st-row .st-split{height:16px;border-radius:5px;background:var(--deep-2)}
.st-cols{display:flex;align-items:flex-end;gap:8px;height:170px;border-bottom:1px solid var(--line);overflow-x:auto}
.st-col{flex:1 0 34px;max-width:52px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.st-col i{font-style:normal;font-size:12px;color:var(--pale)}
.st-col em{font-style:normal;font-size:11px;color:var(--mute);white-space:nowrap}
.st-stack{width:100%;display:flex;flex-direction:column-reverse;gap:2px;border-radius:5px 5px 0 0;overflow:hidden}
.st-none{color:var(--mute);font-size:14px}
.st-pct{width:100%;border-radius:5px 5px 0 0;background:var(--innov)}
.peekpass{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.peekpass[hidden]{display:none}
#peekPw{background:var(--panel);border:2px solid var(--line);border-radius:999px;color:var(--pale);font-size:16px;padding:10px 18px;width:min(100%,240px)}
#peekPw:focus{outline:none;border-color:var(--accent)}
.peekpass .ghost{align-self:auto;padding:9px 20px}
#peekErr{color:var(--coral)}
.stat b{display:block;font-size:clamp(24px,3.6vw,34px);font-weight:700;line-height:1}
.stat span{color:var(--mute);font-size:clamp(11px,1.4vw,14px);line-height:1.3;display:block;margin-top:5px}

/* stage spread */
.legend em{font-style:normal;display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* gallery cards */
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:clamp(9px,1.4vw,14px)}
.gcard{background:var(--panel);border-radius:20px;overflow:hidden;display:flex;position:relative;min-height:274px}
.art{background:var(--deep-2);padding:14px 16px 8px}
.art svg{width:100%;height:auto;display:block}
.art .s{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.art .a{stroke:var(--accent)}
.art .f{fill:var(--accent);stroke:none}
.art .fm{fill:var(--line);stroke:none}
.gart,.hero-art{position:relative}
.gart{position:absolute;inset:0 0 0 auto;width:36%;min-height:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;background:transparent;z-index:0}
.gart svg,.hero-art svg{opacity:.55}
.gmascot{display:none}
.gcard:nth-child(2n) .gmascot{animation-duration:7.4s;animation-delay:-1.5s}
.gcard:nth-child(3n) .gmascot{animation-duration:8.2s;animation-delay:-3s}
.heromascot{position:absolute;right:0;bottom:-4px;width:46%;animation-duration:6.6s}

.gbody{position:relative;z-index:1;width:68%;padding:24px 8px 19px 28px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:274px;box-sizing:border-box;text-align:left}
.gbody b,.gbody p,.gplays{width:100%;max-width:none;text-align:left}
.gbody b{font-size:clamp(15px,1.9vw,19px);font-weight:600}
.gbody p{color:var(--mute);font-size:clamp(12px,1.5vw,15px);line-height:1.45;margin:0}
.gplays{color:var(--accent-ink);font-size:clamp(11px,1.4vw,14px);font-weight:600}

@media (max-width:640px){
  .gcard{min-height:250px}
  .gbody{min-height:250px;padding-left:20px}
}


/* ---- mode chooser ---- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,400px));justify-content:center;gap:clamp(10px,1.8vw,20px)}   /* cards keep their size when fewer games are out */
.mode{
  background:var(--panel);border-radius:26px;padding:clamp(18px,3vh,32px) clamp(16px,2.4vw,28px);
  text-align:left;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden;
  border:2px solid transparent;transition:transform .12s ease,border-color .2s;min-height:clamp(150px,26vh,240px);
}
.mode:active{transform:scale(.985)}
.mode.play{border-color:var(--accent)}
.mode b{font-family:var(--display);font-size:clamp(20px,3vw,30px);font-weight:800;line-height:1.1}
.mode span{color:var(--mute);font-size:clamp(12px,1.6vw,16px);line-height:1.45;max-width:26ch}
.mode > b,.mode > span{position:relative;z-index:1}   /* card text reads in front of the Zinion */
.mode .age{color:var(--accent-ink);font-size:clamp(11px,1.4vw,14px);font-weight:700}
.mode img{position:absolute;right:-6px;bottom:-6px;width:auto;height:auto;max-width:min(34%,110px);max-height:58%;opacity:.9;
  filter:drop-shadow(0 10px 16px rgba(0,0,0,.4));animation:bob 5.5s ease-in-out infinite}
@media (max-width:640px){.modes{grid-template-columns:1fr}.mode{min-height:120px}}
/* each game's Zinion takes a turn saying "Try this!" */
.trybubble{
  position:absolute;top:12px;right:12px;font-style:normal;font-weight:700;
  background:var(--accent);color:var(--on-accent);border-radius:14px;padding:5px 12px;
  font-size:clamp(12px,1.5vw,15px);transform-origin:80% 100%;opacity:0;
  animation:trypop 6s ease-in-out infinite;pointer-events:none
}
.trybubble::after{content:"";position:absolute;right:22px;bottom:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--accent)}
@keyframes trypop{0%,4%{opacity:0;transform:scale(.4)}9%,30%{opacity:1;transform:scale(1)}36%,100%{opacity:0;transform:scale(.4)}}
@media (prefers-reduced-motion:reduce){.trybubble{animation:none;opacity:1}}
.drift.bright img{opacity:.32}
.drift img.knock{animation:knock .6s ease-out,bob 7s ease-in-out infinite}
@keyframes knock{0%{opacity:.7}100%{opacity:.16}}

/* ---- scream game ---- */
.gamewrap{position:relative;border-radius:24px;overflow:hidden;background:var(--deep-2);border:2px solid var(--line)}
#gameCanvas{display:block;width:100%;height:clamp(260px,52vh,520px)}
.ghud{
  position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:12px 16px;pointer-events:none;
}
.gscore{font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,40px);line-height:1;
  text-shadow:0 2px 10px rgba(0,0,0,.5)}
.gbest{color:var(--mute);font-size:clamp(11px,1.4vw,14px)}
.meter{width:clamp(90px,22%,190px);height:12px;border-radius:99px;background:var(--glass-2);overflow:hidden}
.meter i{display:block;height:100%;width:0%;background:var(--accent);border-radius:99px;transition:width .06s linear}
.gover{
  position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;background:var(--scrim);padding:20px;
}
.gover.on{display:flex}
.gover h3{font-family:var(--display);font-size:clamp(28px,5.4vw,52px);font-weight:800;line-height:1}
.gover p{color:var(--mute);font-size:clamp(13px,1.8vw,18px);max-width:34ch;line-height:1.5}
.microw{display:flex;align-items:center;gap:11px;justify-content:center;flex-wrap:wrap;
  color:var(--mute);font-size:clamp(10px,1.3vw,13px)}
.microw .slider{width:min(230px,42vw);accent-color:var(--accent)}
.meter{position:relative}
.meter .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--pale);opacity:.85}
.gnote{color:var(--mute);font-size:clamp(11px,1.4vw,14px);text-align:center}


/* ---- Zinion Binary Clock ---- */
#binary{align-items:center;text-align:center}
#binary.screen.on{gap:clamp(8px,1.6vh,18px);overflow-y:auto;overflow-x:hidden;min-height:0}
#binary .topbar{width:100%}
.binscore{text-align:center;line-height:1}
.binscore b{font-family:var(--display);font-size:clamp(26px,4.2vw,44px);font-weight:800;display:block;color:var(--accent-ink)}
.binscore span{color:var(--mute);font-size:clamp(10px,1.3vw,13px);display:block;margin-top:4px}
.binq{text-align:center}
.binhow{margin-top:-6px}
.binstage{display:flex;align-items:flex-end;justify-content:center;gap:clamp(20px,5vw,72px);--floor:clamp(42px,7.4vh,66px)}

/* the house: a warm, wooden town house with a mansard roof */
.house{display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 26px 30px rgba(0,0,0,.45))}
.roof{position:relative;width:100%;height:calc(var(--floor) * .8);
  background:linear-gradient(180deg,#c9ad82,#b3946a);clip-path:polygon(6% 100%,12% 8%,88% 8%,94% 100%)}
.chimney{position:absolute;left:18%;top:0;width:9%;height:40%;background:#b3946a;border-top:3px solid #d8c29d}
.dormer{position:absolute;bottom:14%;width:13%;height:46%;background:#5b4632;border:3px solid #a8875a;border-radius:2px}
.dormer:nth-of-type(2){left:34%} .dormer:nth-of-type(3){right:34%}
.facade{
  display:flex;flex-direction:column;padding:0 clamp(10px,1.6vw,18px);
  background:repeating-linear-gradient(90deg,#dcc39b 0 22px,#d6bc93 22px 23px),#dcc39b;
  border-left:4px solid #c7ab80;border-right:4px solid #c7ab80;
}
.hfloor{display:flex;gap:clamp(10px,1.6vw,20px);align-items:center;justify-content:center;height:var(--floor);
  border-bottom:5px solid #c4a578;box-shadow:0 2px 0 #ead9bb}
.hwin{position:relative;width:clamp(30px,calc(var(--floor) * .6),46px);height:calc(var(--floor) * .72);
  background:#4f3c2a;border:3px solid #a8875a;border-radius:2px;transition:background .4s,box-shadow .4s}
.hfloor.ground .hwin{border-radius:50% 50% 2px 2px / 32% 32% 2px 2px;height:calc(var(--floor) * .8)}
/* window panes */
.hwin::before,.hwin::after{content:"";position:absolute;background:rgba(80,58,36,.85)}
.hwin::before{left:50%;top:0;bottom:0;width:2px;margin-left:-1px}
.hwin::after{top:42%;left:0;right:0;height:2px}
.hwin.on{background:radial-gradient(circle at 50% 45%,#FFFDF0 0%,#FFF1C2 45%,#F7D982 100%);
  box-shadow:0 0 16px rgba(255,236,170,.85),0 0 34px rgba(255,220,130,.35);animation:winlight .5s ease both}
.plinth{width:116%;height:clamp(12px,2vh,18px);background:linear-gradient(#efe6d6,#d8ccb6);border-radius:3px}
@keyframes winlight{from{filter:brightness(.35)}to{filter:none}}

/* the reading: dashed guides with +1, +2, +4, +8 where windows are lit, and the digits below */
.binread{display:grid;grid-template-columns:1.6em repeat(2,minmax(46px,1fr)) 1.2em repeat(2,minmax(46px,1fr));
  width:clamp(250px,30vw,380px);font-family:var(--display);font-weight:700}
.binread .rl{color:var(--mute);opacity:.6;font-size:clamp(11px,1.3vw,14px);display:flex;align-items:center}
.binread .rc{height:var(--floor);border-bottom:2px dashed rgba(185,188,235,.35);display:flex;align-items:center;justify-content:center;
  color:var(--pale);font-size:clamp(16px,2.2vw,24px)}
.binread .rc.mid{border-left:2px dashed rgba(185,188,235,.35)}
.binread .gap{height:var(--floor)}
.binread .rc span{opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;transition-delay:var(--dl,0s)}
.binread.show .rc span{opacity:1;transform:none}
.binread .dg{border-top:4px solid var(--pale);margin-top:12px;padding-top:4px;font-size:clamp(38px,6.4vw,70px);line-height:1;color:var(--mute)}
.binread .dg.mid{border-top-left-radius:0}
.binread .colon{margin-top:16px;font-size:clamp(30px,4.6vw,52px);color:var(--mute);line-height:1;text-align:center}
.binread.show .dg{color:var(--pale)}

.binopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,1.4vw,16px);width:min(760px,100%)}
.binopt{
  background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:clamp(10px,1.8vh,16px) 8px;
  font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,32px);color:var(--pale);transition:transform .12s,border-color .2s,background .2s;
}
.binopt:active{transform:scale(.96)}
.binopt.right{border-color:var(--innov);background:rgba(63,232,39,.16)}
.binopt.wrong{border-color:var(--coral);background:rgba(255,138,138,.14)}
.binopts.locked .binopt:not(.right):not(.wrong){opacity:.45}
.binsay{min-height:2.6em;font-family:var(--display);font-weight:700;font-size:clamp(14px,1.9vw,19px);line-height:1.4;max-width:62ch}
.binsay.good{color:var(--innov)} .binsay.bad{color:var(--coral)}
.binsay small{display:block;color:var(--mute);font-weight:600;font-size:.88em}
@media (max-width:760px){
  .binstage{flex-direction:column;align-items:center}
  .binopts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* shorter screens: drop the how-to line and tighten, so the buttons stay in view */
@media (max-height:900px){
  .binhow{display:none}
  .binstage{--floor:clamp(38px,6.6vh,58px)}
  .binread .dg{font-size:clamp(32px,5.4vw,58px);margin-top:8px}
}
@media (max-height:760px){
  #binary h2.title{font-size:clamp(22px,3.4vw,32px)}
  .binstage{--floor:clamp(34px,5.8vh,46px)}
  .binread .dg{font-size:clamp(28px,4.6vw,46px)}
  .binopt{padding:8px}
  .binsay{min-height:2.4em}
}
@media (prefers-reduced-motion:reduce){.hwin.on{animation:none}.binread .rc span{transition:none}}

/* ---- Zinion Bulbs ---- */
.bulbstage{
  background:linear-gradient(180deg,var(--deep),var(--deep-2));
  border:2px solid var(--line);border-radius:24px;
  padding:0 clamp(8px,2vw,26px) clamp(18px,3vh,30px);
  position:relative;overflow:hidden;
}
.bulbwrap{display:flex;gap:clamp(12px,2vw,24px);align-items:stretch}
.bulbwrap .bulbstage{flex:1;min-width:0}
@media (max-width:760px){ .bulbwrap{flex-direction:column} .bulbwrap .puzdash{width:100%} }
.bulbrow{display:flex;justify-content:center;align-items:flex-start;gap:clamp(2px,1.4vw,20px)}
.bulb{
  flex:1;max-width:150px;background:none;padding:0;
  transform-origin:50% 0;transition:transform .12s ease;
}
.bulb:active{transform:translateY(5px)}
.bulb svg{width:100%;height:auto;display:block;overflow:visible}
.b-cord{stroke:var(--line);stroke-width:1.6;fill:none}
.b-cap{fill:var(--line)}
.b-cap-shine{fill:#5A5FD0}
.b-glass{fill:var(--deep-2);stroke:var(--line);stroke-width:1.4;transition:fill .18s,stroke .18s}
.b-wire{stroke:var(--line);stroke-width:1.3;fill:none;stroke-linecap:round;transition:stroke .18s}
.b-glow{fill:var(--accent);opacity:0;transition:opacity .25s}
.bulb.lit .b-glass{fill:#F2A63B;stroke:#FFD79A}
.bulb.lit .b-wire{stroke:#7A4A10}
.bulb.lit .b-glow{opacity:.30}
.bulb.wrong .b-glass{fill:var(--coral);stroke:#FFC2B8}
.bulb.wrong .b-glow{opacity:.30;fill:var(--coral)}
.bulb.dead{opacity:.45;pointer-events:none}
.bulbs-lock .bulb{pointer-events:none}

.bulbhead{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:14px 4px 0}
.bulbround{font-family:var(--display);font-weight:800;font-size:clamp(20px,3.2vw,32px);line-height:1}
.bulbbest{color:var(--mute);font-size:clamp(11px,1.4vw,14px)}
.bulbsay{
  text-align:center;font-family:var(--display);font-weight:700;
  font-size:clamp(15px,2.2vw,22px);min-height:1.6em;margin-top:4px;
}
.bulbsay.go{color:var(--accent-ink)}
.bulbhosts{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:6px}
.bulbhosts .bulbsay{flex:1;margin:0 0 10px}
.bulbhost{position:relative;width:clamp(64px,10vw,110px);flex-shrink:0;opacity:.35;transition:opacity .25s,transform .25s}
.bulbhost img{width:100%;height:auto;display:block}
.bulbhost.talk{opacity:1;transform:translateY(-4px)}
.bulbbubble{
  position:absolute;bottom:100%;left:0;margin-bottom:6px;
  background:var(--accent);color:var(--on-accent);font-weight:700;font-size:clamp(12px,1.5vw,15px);
  padding:6px 12px;border-radius:14px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none;
}
.bulbbubble::after{content:"";position:absolute;left:24px;bottom:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--accent)}
.bulbhost.talk .bulbbubble{opacity:1}
#bulbHostYou .bulbbubble{left:auto;right:0}
#bulbHostYou .bulbbubble::after{left:auto;right:24px}
@media (prefers-reduced-motion:reduce){.bulbhost,.bulbbubble{transition:none}.bulbhost.talk{transform:none}}
.bulbhost.help{opacity:1}   /* the helper during practice, without the "Your turn" bubble */
.bulb.tap{transform:translateY(5px)}   /* the helper pressing a bulb in the practice round */
.bulb.tap .b-glass{fill:#F2A63B;stroke:#FFD79A}
.bulb.tap .b-glow{opacity:.30}

/* ---- helper carousel before Zinion Bulbs: one big Zinion in front, the others turning behind ---- */
#helper.on{display:block;position:fixed;inset:0;z-index:45;overflow:hidden;color:#fff;
  background:var(--hc-bg,#3FA77A);transition:background-color .65s cubic-bezier(.4,0,.2,1)}
.hc-ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;translate:0 -16%;
  font-family:var(--display);font-weight:800;font-size:clamp(80px,19vw,320px);line-height:1;letter-spacing:-.02em;
  text-transform:uppercase;white-space:nowrap;opacity:.22;pointer-events:none;user-select:none}
.hc-kicker{position:absolute;top:clamp(16px,3.4vh,30px);left:50%;translate:-50% 0;z-index:60;white-space:nowrap;
  font-size:clamp(11px,1.3vw,14px);font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.92}
.hc-back{position:absolute;top:clamp(12px,2.6vh,24px);left:clamp(12px,2vw,28px);z-index:60;color:#fff;font-weight:600;
  border:2px solid rgba(255,255,255,.7);border-radius:999px;padding:8px 18px}
/* a real turntable: the Zinions stand round a ring that turns in depth, each one
   turning back as it goes so it always faces the visitor */
.hc-ring{position:absolute;inset:0;z-index:3;perspective:1100px;perspective-origin:50% 30%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#helper.hc-dragging .hc-ring{cursor:grabbing}
#helper.hc-dragging .hc-spin,#helper.hc-dragging .hc-item{transition:none}   /* follow the finger exactly */
.hc-floor{position:absolute;left:50%;bottom:9%;width:min(120vh,86vw);height:18vh;translate:-50% 0;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,255,.34),rgba(255,255,255,.12) 62%,transparent);box-shadow:0 0 60px rgba(255,255,255,.12)}
.hc-spin{--h:min(48vh,50vw);--r:calc(var(--h) * .95);position:absolute;left:50%;bottom:17%;height:var(--h);width:calc(var(--h) * .8);
  margin-left:calc(var(--h) * -.4);transform-style:preserve-3d;transition:transform .85s cubic-bezier(.4,0,.2,1)}
.hc-item{position:absolute;inset:0;cursor:pointer;transform-origin:50% 100%;transition:transform .85s cubic-bezier(.4,0,.2,1),filter .85s,opacity .85s}
.hc-item img{width:100%;height:100%;object-fit:contain;object-position:bottom center;display:block;
  filter:drop-shadow(0 18px 26px rgba(0,0,0,.28));user-select:none;-webkit-user-drag:none}
.hc-item.center img{animation:bob 5s ease-in-out infinite}
.hc-item.left,.hc-item.right{filter:blur(1.5px);opacity:.9}
.hc-item.backl,.hc-item.backr{filter:blur(3.5px);opacity:.65}
.hc-info{position:absolute;left:clamp(16px,6vw,96px);bottom:clamp(20px,8vh,80px);z-index:60;max-width:330px}
.hc-name{display:block;font-family:var(--display);font-weight:800;font-size:clamp(24px,2.8vw,38px);line-height:1;margin-bottom:8px}
.hc-desc{font-size:clamp(12px,1.1vw,15px);line-height:1.55;opacity:.9;margin-bottom:16px}
.hc-nav{display:flex;gap:12px}
.hc-btn{width:clamp(48px,4.4vw,64px);height:clamp(48px,4.4vw,64px);border-radius:50%;border:2px solid #fff;
  display:flex;align-items:center;justify-content:center;transition:transform .15s,background-color .15s}
.hc-btn:active{transform:scale(.94);background:rgba(255,255,255,.15)}
.hc-btn svg,.hc-choose svg{width:26px;height:26px;stroke:#fff;stroke-width:2.25;fill:none;stroke-linecap:round;stroke-linejoin:round}
.hc-choose{position:absolute;right:clamp(16px,3vw,48px);bottom:clamp(20px,8vh,80px);z-index:60;display:flex;align-items:center;gap:10px;
  font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,56px);line-height:1;text-transform:uppercase;color:#fff}
.hc-choose svg{width:clamp(24px,2.6vw,38px);height:clamp(24px,2.6vw,38px);animation:hcnudge 1.6s ease-in-out infinite}
@keyframes hcnudge{50%{translate:6px 0}}
@media (max-width:640px){
  .hc-spin{--h:min(38vh,52vw);bottom:30%}
  .hc-floor{bottom:24%}
  .hc-desc{display:none}
}
@media (prefers-reduced-motion:reduce){.hc-item,.hc-spin,#helper.on{transition:none}.hc-item.center img,.hc-choose svg{animation:none}}
.bulbsay.bad{color:var(--coral)}



/* ---- Zinion Puzzle ---- */
#puzzle > h2.title{text-align:center}
.puzwrap{
  display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:clamp(14px,2.4vw,28px);width:min(100%,920px);align-self:center;
}
.puzpickwrap{display:flex;flex-direction:column;gap:8px;align-items:center;flex:0 0 auto}
.puzlabel{font-family:var(--display);font-weight:700;color:var(--pale);font-size:clamp(13px,1.6vw,16px)}
.puzpick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:0 0 auto}
.puzchar{
  width:clamp(52px,8vw,88px);border-radius:16px;background:var(--panel);padding:6px;
  border:2px solid transparent;transition:transform .15s,border-color .2s;
}
.puzchar img{width:100%;height:auto;display:block}
.puzchar.on{border-color:var(--accent);transform:translateY(-4px)}
.puzmain{display:flex;flex-direction:column;gap:clamp(6px,1.2vh,12px);align-items:center;flex:1;min-width:0}
.puzstage{
  border:2px solid var(--line);color:var(--mute);border-radius:999px;padding:7px 16px;
  font-weight:600;font-size:clamp(12px,1.5vw,15px);
}

.puzboard{
  display:grid;gap:4px;background:var(--deep-2);padding:6px;border-radius:20px;
  width:min(100%,clamp(200px,36vh,360px));aspect-ratio:1/1;
  border:2px solid var(--line);position:relative;
}
.ptile{
  border-radius:11px;background-repeat:no-repeat;position:relative;
  transition:transform .13s;cursor:pointer;
}
.ptile:active{transform:scale(.96)}
.ptile.blank{background:none;box-shadow:inset 0 0 0 2px var(--glass);cursor:default}
.ptile span{
  position:absolute;left:5px;top:4px;font-size:11px;font-weight:700;
  color:rgba(0,0,0,.5);background:rgba(255,255,255,.6);border-radius:6px;padding:0 5px;
}
.ptile.blank span{display:none}
.puzmodes{display:flex;gap:6px;justify-content:center}
.puzmode{border:2px solid var(--line);border-radius:999px;padding:6px 18px;color:var(--mute);font-weight:600;font-size:clamp(13px,1.6vw,16px)}
.puzmode.on{border-color:var(--accent);color:var(--accent-ink)}
/* swap mode: real jigsaw pieces, whose tabs reach into the next cell */
.puzboard.jig{gap:0;padding:10px}
.puzboard.jig .ptile{border-radius:0;background:none}
.puzboard.jig .ptile svg{position:absolute;left:-25%;top:-25%;width:150%;height:150%;overflow:visible;pointer-events:none}
.pedge{fill:none;stroke:rgba(255,255,255,.5);stroke-width:.014}
.puzboard.jig .ptile.sel,.puzboard.jig .ptile.hint{z-index:2;box-shadow:none}
.puzboard.jig .ptile.sel svg{filter:drop-shadow(0 0 8px var(--accent));transform:scale(1.06)}
.puzboard.jig .ptile.sel .pedge,.puzboard.jig .ptile.hint .pedge{stroke:var(--accent);stroke-width:.04}
.puzboard.jig .ptile.hint svg{filter:drop-shadow(0 0 8px var(--accent))}
.puzboard.jig.done .pedge{opacity:0;transition:opacity .4s}
.puzboard.done .ptile{cursor:default}
.puzboard.done .ptile span{opacity:0;transition:opacity .4s}
.ptile.lastpiece{animation:dropin .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes dropin{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ptile.lastpiece{animation:none}}
.ptile.hint{box-shadow:0 0 0 4px var(--accent),0 0 22px var(--accent);z-index:1;animation:hintpulse 1s ease-in-out infinite}
@keyframes hintpulse{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.ptile.hint{animation:none}}
.puzstat{display:flex;gap:24px;color:var(--mute);font-size:clamp(12px,1.6vw,16px)}
.puzstat b{color:var(--pale);font-family:var(--display);font-weight:700;font-size:clamp(17px,2.3vw,22px)}
.puzsay{font-family:var(--display);font-weight:700;font-size:clamp(15px,2.2vw,21px);min-height:1.5em;text-align:center}
.puzsay.win{color:var(--accent-ink)}

.puzdash{
  flex:0 0 auto;width:clamp(160px,20vw,220px);align-self:stretch;
  background:var(--panel);border:2px solid var(--line);border-radius:16px;
  padding:14px 16px;display:flex;flex-direction:column;gap:10px;
}
.puzdash b{font-family:var(--display);font-weight:700;font-size:clamp(13px,1.6vw,16px);color:var(--pale)}
.puzdashlist{display:flex;flex-direction:column;gap:6px}
.puzdashrow{
  display:flex;justify-content:space-between;gap:10px;color:var(--mute);
  font-size:clamp(12px,1.4vw,14px);
}
.puzdashrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.puzdashrow b{color:var(--pale);font-family:var(--display);font-weight:700}
.puzdashrow.me{color:var(--accent-ink)}
.puzdashrow.me b{color:var(--accent-ink)}
.puzdashempty{color:var(--mute);font-size:clamp(12px,1.4vw,14px);line-height:1.4}

@media (max-width:640px){
  .puzwrap{gap:10px}
  .puzpick{gap:6px}
  .puzchar{width:clamp(40px,12vw,56px);border-radius:12px;padding:4px}
  .puzlabel{font-size:12px}
  .puzstat{gap:14px}
  .puzdash{width:100%;order:3}
}




/* ---- Wind Tunnel ---- */
.windwrap{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--line);background:#161966}
#windCanvas{display:block;width:100%;height:clamp(280px,52vh,500px)}
.whud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  gap:14px;padding:12px 16px;pointer-events:none}
.whud .lab{color:var(--mute);font-size:clamp(10px,1.3vw,13px)}
.whud b{font-family:var(--display);font-weight:800;font-size:clamp(19px,3vw,30px);display:block;line-height:1}
.fanbar{width:clamp(100px,26%,210px);height:13px;border-radius:99px;background:var(--glass-2);overflow:hidden}
